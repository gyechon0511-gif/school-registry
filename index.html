    // --- Excel (.xlsx) Exporter Utility (uses window.XLSX) ---
    function sanitizeFilename(name) {
      return name.replace(/[\\/:*?"<>|]/g, '_').trim();
    }

    function exportTrainingRegisterToExcel(training, allTrainings = []) {
      if (!window.XLSX) {
        alert('Excel 라이브러리를 불러오는 중입니다. 잠시 후 다시 시도해주세요.');
        return;
      }
      const wb = XLSX.utils.book_new();
      const signedStaffList = training.staffList.filter(s => !!s.signature);
      const totalStaffCount = training.staffList.length;
      const signedCount = signedStaffList.length;
      const progressPercent = totalStaffCount > 0 ? Math.round((signedCount / totalStaffCount) * 100) : 0;

      const buildSheetData = (list, subTitle) => {
        const data = [
          [`${training.title} 등록부 (${subTitle})`],
          [`학교명: ${training.school}`, `일시: ${training.date} ${training.time || ''}`, `장소: ${training.location}`],
          [`주관/강사: ${training.instructor || training.school}`, `연수대상: ${training.target || '전 교직원'}`, `참석 현황: 총 ${signedCount}명 서명 / 전체 ${totalStaffCount}명 (${progressPercent}%)`],
          [],
          ['연번', '소속', '직위', '성명', '서명 여부', '서명 일시', '비고']
        ];

        list.forEach((staff, index) => {
          data.push([
            index + 1,
            staff.department,
            staff.position,
            staff.name,
            staff.signature ? '서명완료' : '미서명',
            staff.signedAt || '-',
            staff.note || ''
          ]);
        });

        data.push([]);
        data.push([`위와 같이 ${training.title}에 참석하여 서명하였음을 확인합니다.`]);
        data.push([`${training.school}장`]);

        const ws = XLSX.utils.aoa_to_sheet(data);
        ws['!cols'] = [
          { wch: 8 }, { wch: 16 }, { wch: 16 }, { wch: 14 },
          { wch: 14 }, { wch: 22 }, { wch: 20 }
        ];
        return ws;
      };

      XLSX.utils.book_append_sheet(wb, buildSheetData(signedStaffList, `서명완료자 ${signedCount}명`), '서명자 명단');
      XLSX.utils.book_append_sheet(wb, buildSheetData(training.staffList, `전체 ${totalStaffCount}명`), '전체 교직원 명단');

      if (allTrainings && allTrainings.length > 0) {
        XLSX.utils.book_append_sheet(wb, buildAllTrainingsSheet(allTrainings), '전체 연수 대장 목록');
      }

      const todayStr = new Date().toISOString().slice(0, 10).replace(/-/g, '');
      const cleanTitle = sanitizeFilename(training.title);
      XLSX.writeFile(wb, `${cleanTitle}_연수등록부_${todayStr}.xlsx`);
    }

    function buildAllTrainingsSheet(trainings) {
      const data = [
        ['계촌중학교 교직원 연수 개설 및 등록 현황 대장'],
        [`기준일자: ${new Date().toLocaleDateString('ko-KR')}`, `총 개설 연수: ${trainings.length}건`],
        [],
        ['연번', '연수 제목', '연수 일시', '시간', '장소', '주관/강사', '연수 대상', '서명 인원', '총 정원', '서명률(%)', '상태']
      ];

      trainings.forEach((t, idx) => {
        const signed = t.staffList.filter(s => !!s.signature).length;
        const total = t.staffList.length;
        const rate = total > 0 ? Math.round((signed / total) * 100) : 0;
        data.push([
          idx + 1,
          t.title,
          t.date,
          t.time || '-',
          t.location,
          t.instructor || t.school,
          t.target || '전 교직원',
          signed,
          total,
          `${rate}%`,
          t.status === 'active' ? '진행중' : '완료'
        ]);
      });

      const ws = XLSX.utils.aoa_to_sheet(data);
      ws['!cols'] = [
        { wch: 8 }, { wch: 30 }, { wch: 18 }, { wch: 16 },
        { wch: 16 }, { wch: 16 }, { wch: 16 }, { wch: 12 },
        { wch: 10 }, { wch: 12 }, { wch: 10 }
      ];
      return ws;
    }

      const wb = XLSX.utils.book_new();

    // --- URL Helper: Bulletproof QR Code target & URL state parser ---
    function buildQrTargetUrl(training) {
      try {
        const origin = window.location.origin;
        let pathname = window.location.pathname || '/';
        if (!pathname.endsWith('/') && !pathname.includes('.')) {
          pathname = pathname + '/';
        }
        const cleanBase = origin + pathname;
        const params = new URLSearchParams();
        params.set('trainingId', training.id);
        params.set('view', 'sign');
        params.set('title', training.title);
        params.set('date', training.date);
        if (training.time) params.set('time', training.time);
        params.set('loc', training.location);
        if (training.school) params.set('school', training.school);
        if (training.instructor) params.set('inst', training.instructor);
        if (training.target) params.set('target', training.target);

        return `${cleanBase}?${params.toString()}#sign`;
      } catch (e) {
        return `${window.location.origin}/?trainingId=${encodeURIComponent(training.id)}&view=sign#sign`;
      }
    }

    function parseTrainingFromUrl() {
      try {
        const searchParams = new URLSearchParams(window.location.search);
        const hash = window.location.hash || '';
        let hashParams = new URLSearchParams();
        if (hash.includes('?')) {
          hashParams = new URLSearchParams(hash.split('?')[1]);
        }

        const trainingId =
          searchParams.get('trainingId') ||
          searchParams.get('id') ||
          searchParams.get('tid') ||
          hashParams.get('trainingId') ||
          hashParams.get('id') ||
          hashParams.get('tid') ||
          (hash.startsWith('#sign-') ? hash.replace('#sign-', '') : null) ||
          (hash.startsWith('#training-') ? hash.replace('#', '') : null) ||
          null;

        const viewParam = (
          searchParams.get('view') ||
          hashParams.get('view') ||
          ''
        ).toLowerCase();

        let targetView = 'dashboard';
        if (viewParam === 'admin' || hash.includes('admin')) {
          targetView = 'admin';
        } else if (viewParam === 'sign' || hash.includes('sign') || Boolean(trainingId)) {
          targetView = 'sign';
        }

        let metadata = null;
        const title = searchParams.get('title') || hashParams.get('title');
        if (trainingId && title) {
          metadata = {
            id: trainingId,
            title: title,
            date: searchParams.get('date') || hashParams.get('date') || '',
            time: searchParams.get('time') || hashParams.get('time') || '15:30 ~ 16:30',
            location: searchParams.get('loc') || searchParams.get('location') || '도서관',
            school: searchParams.get('school') || '계촌중학교',
            instructor: searchParams.get('inst') || searchParams.get('instructor') || '',
            target: searchParams.get('target') || '전 교직원',
            status: 'active',
            createdAt: Date.now()
          };
        }

        return { trainingId, targetView, metadata };
      } catch (e) {
        return { trainingId: null, targetView: 'dashboard', metadata: null };
      }
    }

    function createSessionFromMetadata(meta) {
      return {
        id: meta.id || `training-${Date.now()}`,
        title: meta.title || '교직원 연수',
        date: meta.date || '2026. 9. 29.(화)',
        time: meta.time || '15:30 ~ 16:30',
        location: meta.location || '2층 도서관',
        school: meta.school || '계촌중학교',
        instructor: meta.instructor || '',
        target: meta.target || '전 교직원',
        status: meta.status || 'active',
        createdAt: meta.createdAt || Date.now(),
        staffList: BASE_STAFF_ROSTER.map(s => ({ ...s }))
      };
    }

    // ==========================================
    // Component 1: Mobile Signature Canvas View
    // ==========================================
    function MobileSignView({ training, onBackToDashboard, onSaveSignature, onAddNewStaffAndSign }) {
      const [signMode, setSignMode] = useState('existing');
      const [selectedStaffId, setSelectedStaffId] = useState('');
      const [customName, setCustomName] = useState('');
      const [customDept, setCustomDept] = useState('');
      const [customPos, setCustomPos] = useState('');
      const [strokeColor, setStrokeColor] = useState('#0f172a');
      const [hasDrawn, setHasDrawn] = useState(false);
      const [submitSuccess, setSubmitSuccess] = useState(false);

      const canvasRef = useRef(null);
      const isDrawingRef = useRef(false);
      const lastPointRef = useRef(null);

      const staffList = training.staffList || [];
      const selectedMember = staffList.find(s => s.id === Number(selectedStaffId));

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        if (!ctx) return;

        const resize = () => {
          const rect = canvas.getBoundingClientRect();
          const dpr = window.devicePixelRatio || 1;
          canvas.width = rect.width * dpr;
          canvas.height = rect.height * dpr;
          ctx.scale(dpr, dpr);
          ctx.lineCap = 'round';
          ctx.lineJoin = 'round';
        };

        resize();
        window.addEventListener('resize', resize);
        return () => window.removeEventListener('resize', resize);
      }, []);

      const getCanvasCoords = (e) => {
        const canvas = canvasRef.current;
        if (!canvas) return { x: 0, y: 0 };
        const rect = canvas.getBoundingClientRect();
        let clientX = 0;
        let clientY = 0;

        if (e.touches) {
          if (e.touches.length > 0) {
            clientX = e.touches[0].clientX;
            clientY = e.touches[0].clientY;
          } else if (e.changedTouches && e.changedTouches.length > 0) {
            clientX = e.changedTouches[0].clientX;
            clientY = e.changedTouches[0].clientY;
          }
        } else {
          clientX = e.clientX;
          clientY = e.clientY;
        }

        return { x: clientX - rect.left, y: clientY - rect.top };
      };

      const startDrawing = (e) => {
        if (signMode === 'existing' && (!selectedMember || selectedMember.signature)) return;
        isDrawingRef.current = true;
        const p = getCanvasCoords(e);
        lastPointRef.current = p;
        setHasDrawn(true);
      };

      const draw = (e) => {
        if (!isDrawingRef.current || !canvasRef.current) return;
        if (e.touches) e.preventDefault();

        const ctx = canvasRef.current.getContext('2d');
        if (!ctx) return;
        const currentPoint = getCanvasCoords(e);
        const lastPoint = lastPointRef.current || currentPoint;

        ctx.strokeStyle = strokeColor;
        ctx.lineWidth = 3;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        ctx.beginPath();
        ctx.moveTo(lastPoint.x, lastPoint.y);
        ctx.lineTo(currentPoint.x, currentPoint.y);
        ctx.stroke();

        lastPointRef.current = currentPoint;
      };

      const stopDrawing = () => {
        isDrawingRef.current = false;
        lastPointRef.current = null;
      };

      const clearCanvas = () => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        if (!ctx) return;
        const dpr = window.devicePixelRatio || 1;
        ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
        setHasDrawn(false);
      };

      const handleSubmit = () => {
        if (!hasDrawn || !canvasRef.current) {
          alert('서명 패드에 본인의 서명을 작성해주세요.');
          return;
        }
        const signatureDataUrl = canvasRef.current.toDataURL('image/png');

        if (signMode === 'custom') {
          if (!customName.trim()) {
            alert('성명을 입력해주세요.');
            return;
          }
          onAddNewStaffAndSign(
            training.id,
            {
              name: customName.trim(),
              department: customDept.trim() || '교직원',
              position: customPos.trim() || '교직원'
            },
            signatureDataUrl
          );
          setCustomName('');
          setCustomDept('');
          setCustomPos('');
          clearCanvas();
          setSubmitSuccess(true);
          setTimeout(() => setSubmitSuccess(false), 4000);
          return;
        }

        if (!selectedMember) {
          alert('교직원 본인 이름을 먼저 선택해주세요.');
          return;
        }
        if (selectedMember.signature) {
          alert('이미 서명이 완료된 교직원입니다.');
          return;
        }

        onSaveSignature(training.id, selectedMember.id, signatureDataUrl);
        setSubmitSuccess(true);
        clearCanvas();
        setTimeout(() => setSubmitSuccess(false), 4000);
      };

      const signedCount = staffList.filter(s => !!s.signature).length;

      return (
        <div className="max-w-lg mx-auto p-4 sm:p-6 pb-20 space-y-4">
          <button
            onClick={onBackToDashboard}
            className="flex items-center gap-1.5 text-xs font-semibold text-slate-500 hover:text-indigo-600 transition-colors"
          >
            <ArrowLeftIcon className="w-4 h-4" />
            <span>전체 연수 목록으로 돌아가기</span>
          </button>

          {/* Training Info Card */}
          <div className="bg-white rounded-2xl p-5 shadow-sm border border-slate-200">
            <div className="flex items-center justify-between gap-2 border-b border-slate-100 pb-3 mb-3">
              <span className="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-semibold bg-indigo-50 text-indigo-700">
                <SchoolIcon className="w-3.5 h-3.5" />
                {training.school}
              </span>
              <span className="text-xs font-medium text-slate-500">
                서명 현황: <strong className="text-indigo-600">{signedCount}</strong> / {staffList.length}명
              </span>
            </div>

            <h1 className="text-base sm:text-lg font-bold text-slate-900 leading-snug mb-3">
              {training.title}
            </h1>

            <div className="grid grid-cols-1 sm:grid-cols-2 gap-2 text-xs text-slate-600">
              <div className="flex items-center gap-2">
                <CalendarIcon className="w-4 h-4 text-slate-400 shrink-0" />
                <span>{training.date} {training.time ? `(${training.time})` : ''}</span>
              </div>
              <div className="flex items-center gap-2">
                <MapPinIcon className="w-4 h-4 text-slate-400 shrink-0" />
                <span>장소: {training.location}</span>
              </div>
            </div>
          </div>

          {/* Mode Selector Card */}
          <div className="bg-white rounded-2xl p-5 shadow-sm border border-slate-200 space-y-4">
            <div className="flex items-center justify-between">
              <label className="text-xs font-bold text-slate-700 uppercase tracking-wider">
                서명자 확인 방식
              </label>
              <div className="flex items-center bg-slate-100 p-0.5 rounded-lg border border-slate-200 text-xs">
                <button
                  type="button"
                  onClick={() => { setSignMode('existing'); clearCanvas(); }}
                  className={`px-2.5 py-1 rounded-md font-semibold transition-all ${
                    signMode === 'existing' ? 'bg-white text-indigo-600 shadow-xs' : 'text-slate-500 hover:text-slate-900'
                  }`}
                >
                  명단에서 선택
                </button>
                <button
                  type="button"
                  onClick={() => { setSignMode('custom'); setSelectedStaffId(''); clearCanvas(); }}
                  className={`px-2.5 py-1 rounded-md font-semibold transition-all ${
                    signMode === 'custom' ? 'bg-white text-indigo-600 shadow-xs' : 'text-slate-500 hover:text-slate-900'
                  }`}
                >
                  직접 추가 (신규)
                </button>
              </div>
            </div>

            {signMode === 'existing' ? (
              <div className="space-y-3">
                <select
                  value={selectedStaffId}
                  onChange={(e) => {
                    setSelectedStaffId(e.target.value === '' ? '' : Number(e.target.value));
                    clearCanvas();
                    setSubmitSuccess(false);
                  }}
                  className="w-full bg-slate-50 border border-slate-300 text-slate-900 text-sm rounded-xl px-3.5 py-2.5 focus:ring-2 focus:ring-indigo-500 outline-none font-medium"
                >
                  <option value="">-- 본인 성명을 선택해주세요 --</option>
                  {staffList.map((staff) => (
                    <option
                      key={staff.id}
                      value={staff.id}
                      disabled={!!staff.signature}
                      className={staff.signature ? 'text-slate-400' : 'text-slate-900 font-medium'}
                    >
                      {staff.id}. {staff.name} ({staff.department} / {staff.position})
                      {staff.signature ? ' [✓ 서명완료]' : ''}
                    </option>
                  ))}
                </select>

                {selectedMember && (
                  <div className="flex items-center justify-between p-3 rounded-xl bg-slate-50 border border-slate-200 text-xs">
                    <div className="flex items-center gap-2">
                      <UserIcon className="w-4 h-4 text-indigo-600" />
                      <span className="font-bold text-slate-900">{selectedMember.name}</span>
                      <span className="text-slate-500">·</span>
                      <span className="text-slate-600">{selectedMember.department}</span>
                      <span className="text-slate-500">·</span>
                      <span className="text-slate-600 font-medium">{selectedMember.position}</span>
                    </div>
                    {selectedMember.signature && (
                      <span className="text-xs font-semibold text-emerald-600 bg-emerald-50 px-2.5 py-0.5 rounded-full border border-emerald-200">
                        서명 완료됨
                      </span>
                    )}
                  </div>
                )}
              </div>
            ) : (
              <div className="space-y-3 bg-indigo-50/50 p-3.5 rounded-xl border border-indigo-100">
                <div className="text-[11px] text-indigo-700 font-medium">
                  명단에 본인 이름이 없으신 경우, 소속·직위·성명을 직접 입력하고 서명하시면 즉시 등록부에 반영됩니다.
                </div>
                <div className="grid grid-cols-1 sm:grid-cols-3 gap-2">
                  <div>
                    <label className="block text-[11px] font-bold text-slate-600 mb-1">소속</label>
                    <input
                      type="text"
                      placeholder="예: 교무실"
                      value={customDept}
                      onChange={(e) => setCustomDept(e.target.value)}
                      className="w-full bg-white border border-slate-300 rounded-lg px-3 py-2 text-xs text-slate-900 outline-none"
                    />
                  </div>
                  <div>
                    <label className="block text-[11px] font-bold text-slate-600 mb-1">직위</label>
                    <input
                      type="text"
                      placeholder="예: 교사"
                      value={customPos}
                      onChange={(e) => setCustomPos(e.target.value)}
                      className="w-full bg-white border border-slate-300 rounded-lg px-3 py-2 text-xs text-slate-900 outline-none"
                    />
                  </div>
                  <div>
                    <label className="block text-[11px] font-bold text-slate-600 mb-1">
                      성명 <span className="text-rose-500">*</span>
                    </label>
                    <input
                      type="text"
                      placeholder="본인 성명 입력"

                      className="w-full bg-white border border-slate-300 rounded-lg px-3 py-2 text-xs text-slate-900 font-bold outline-none"
                    />
                  </div>
                </div>
              </div>
            )}
          </div>

          {/* Canvas Card */}
          <div className="bg-white rounded-2xl p-5 shadow-sm border border-slate-200 space-y-4">
            <div className="flex items-center justify-between">
              <div>

                <p className="text-[11px] text-slate-500">아래 네모 영역에 손가락이나 펜으로 직접 정자로 서명해주세요.</p>
              </div>
              <div className="flex items-center gap-1.5">
                <button
                  type="button"
                  onClick={() => setStrokeColor('#0f172a')}
                  className={`w-5 h-5 rounded-full bg-slate-900 transition-transform ${strokeColor === '#0f172a' ? 'scale-125 ring-2 ring-indigo-500 ring-offset-2' : ''}`}
                  title="검정색 잉크"
                />
                <button
                  type="button"
                  onClick={() => setStrokeColor('#1e40af')}
                  className={`w-5 h-5 rounded-full bg-blue-800 transition-transform ${strokeColor === '#1e40af' ? 'scale-125 ring-2 ring-indigo-500 ring-offset-2' : ''}`}
                  title="파란색 잉크"
                />
              </div>
            </div>

            {signMode === 'existing' && selectedMember?.signature ? (
              <div className="rounded-xl border-2 border-dashed border-emerald-300 bg-emerald-50/60 p-6 flex flex-col items-center justify-center text-center space-y-2">
                <CheckCircle2Icon className="w-10 h-10 text-emerald-600" />
                <div className="text-sm font-bold text-emerald-800">서명이 정상적으로 등록되었습니다</div>
                <p className="text-xs text-emerald-600">서명 일시: {selectedMember.signedAt}</p>
                <div className="bg-white p-2 rounded-lg border border-emerald-200 shadow-xs max-w-xs mt-2">
                  <img src={selectedMember.signature} alt="등록된 서명" className="h-16 mx-auto object-contain" />
                </div>
              </div>
            ) : (
              <div className="space-y-3">
                <div className="relative rounded-xl border-2 border-slate-300 bg-slate-50/50 overflow-hidden touch-none h-48 sm:h-56">
                  <canvas
                    ref={canvasRef}
                    onMouseDown={startDrawing}
                    onMouseMove={draw}
                    onMouseUp={stopDrawing}
                    onMouseLeave={stopDrawing}
                    onTouchStart={startDrawing}
                    onTouchMove={draw}
                    onTouchEnd={stopDrawing}
                    className="w-full h-full cursor-crosshair block"
                  />
                  {!hasDrawn && (
                    <div className="absolute inset-0 flex items-center justify-center pointer-events-none text-slate-400 text-xs">
                      여기에 서명하세요 (터치 또는 마우스 드래그)
                    </div>
                  )}
                </div>

                <div className="flex items-center justify-between gap-3 pt-1">
                  <button
                    type="button"
                    onClick={clearCanvas}
                    className="flex items-center gap-1.5 px-3.5 py-2 rounded-xl text-xs font-medium text-slate-600 bg-slate-100 hover:bg-slate-200 active:scale-95 transition-all"
                  >
                    <RotateCcwIcon className="w-3.5 h-3.5" />
                    <span>다시 쓰기</span>
                  </button>

                  <button
                    type="button"
                    onClick={handleSubmit}
                    disabled={signMode === 'existing' ? (!selectedMember || !hasDrawn) : (!customName.trim() || !hasDrawn)}
                    className="flex-1 flex items-center justify-center gap-1.5 px-4 py-2.5 rounded-xl text-xs font-bold text-white bg-indigo-600 hover:bg-indigo-700 active:scale-98 disabled:opacity-40 disabled:pointer-events-none transition-all shadow-sm"
                  >
                    <CheckCircle2Icon className="w-4 h-4" />
                    <span>서명 등록 완료</span>
                  </button>
                </div>
              </div>
            )}

            {submitSuccess && (
              <div className="p-3 bg-emerald-50 border border-emerald-200 rounded-xl text-xs text-emerald-800 flex items-center gap-2">
                <SparklesIcon className="w-4 h-4 text-emerald-600 shrink-0" />
                <span>서명이 성공적으로 저장되어 등록부(인쇄본)에 실시간 반영되었습니다!</span>
              </div>
            )}
          </div>
        </div>
      );
    }

      if (!isOpen || !training) return null;

      const targetUrl = buildQrTargetUrl(training);
      const qrApiUrl = `https://api.qrserver.com/v1/create-qr-code/?size=300x300&margin=12&data=${encodeURIComponent(targetUrl)}`;

      const handleCopyUrl = async () => {
        try {
          await navigator.clipboard.writeText(targetUrl);
          setCopied(true);
          setTimeout(() => setCopied(false), 2000);
        } catch (e) {
          window.prompt('서명 접속 URL (복사하여 사용하세요):', targetUrl);
        }
      };

      const handleDirectTest = () => {
        if (onNavigateToSign) {
          onClose();
          onNavigateToSign(training.id);
        } else {
          window.location.href = targetUrl;
        }
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-xs">
          <div className="bg-white rounded-3xl max-w-sm w-full p-5 sm:p-6 shadow-2xl border border-slate-200 text-center space-y-4 max-h-[90vh] overflow-y-auto">
            <div className="flex items-center justify-between">
              <div className="flex items-center gap-2 text-indigo-600 font-bold text-sm">
                <SmartphoneIcon className="w-4 h-4" />
                <span>모바일 서명 QR 코드</span>
              </div>
              <button
                onClick={onClose}
                className="p-1.5 rounded-lg text-slate-400 hover:text-slate-700 hover:bg-slate-100 transition-colors"
              >
                <XIcon className="w-4 h-4" />
              </button>
            </div>

            <div className="text-left bg-indigo-50/70 p-3.5 rounded-2xl border border-indigo-100 space-y-1">
              <div className="text-[11px] text-indigo-600 font-bold tracking-tight">{training.school}</div>
              <div className="text-xs sm:text-sm font-bold text-slate-900 line-clamp-2 leading-tight">
                {training.title}
              </div>
              <div className="text-[11px] text-slate-600 flex items-center gap-1.5 pt-0.5">
                <span>{training.date}</span>
                <span>·</span>
                <span>{training.location}</span>
              </div>
            </div>

            <div className="p-3 bg-white border border-slate-200 rounded-2xl inline-block mx-auto shadow-xs">
              <img
                src={qrApiUrl}
                alt="모바일 서명 QR 코드"
                className="w-48 h-48 sm:w-52 sm:h-52 mx-auto rounded-xl object-contain bg-white"
              />
            </div>

            <div className="space-y-1 text-slate-600 text-xs">
              <p className="font-medium text-slate-800">
                스마트폰 카메라로 위 <strong className="text-indigo-600">QR 코드를 스캔</strong>하세요.
              </p>
              <p className="text-[11px] text-slate-500 leading-normal">
                카메라를 비추면 상단에 나타나는 알림/링크를 터치하면 <strong>해당 연수의 모바일 서명 화면</strong>으로 즉시 이동합니다.
              </p>
            </div>

            <div className="space-y-2 pt-1">
              <div className="flex items-center gap-2">
                <button
                  onClick={handleCopyUrl}
                  className="flex-1 flex items-center justify-center gap-1.5 py-2.5 px-3 text-xs font-semibold text-slate-700 bg-slate-100 hover:bg-slate-200 rounded-xl transition-colors"
                >
                  {copied ? <CheckIcon className="w-3.5 h-3.5 text-emerald-600" /> : <CopyIcon className="w-3.5 h-3.5" />}
                  <span>{copied ? '주소 복사됨!' : '서명 주소 복사'}</span>
                </button>

                <button
                  onClick={handleDirectTest}
                  className="flex-1 flex items-center justify-center gap-1.5 py-2.5 px-3 text-xs font-bold text-indigo-700 bg-indigo-50 hover:bg-indigo-100 border border-indigo-200 rounded-xl transition-colors"
                >
                  <ExternalLinkIcon className="w-3.5 h-3.5" />
                  <span>서명창 바로 이동</span>
                </button>
              </div>

              <button
                onClick={onClose}
                className="w-full py-2.5 px-4 text-xs font-bold text-white bg-indigo-600 hover:bg-indigo-700 rounded-xl transition-colors shadow-xs"
              >
                확인 및 닫기
              </button>
            </div>
          </div>
        </div>
      );
    }

    // ==========================================
    // Main App Component with State Management
    // ==========================================
    function App() {
      const initialUrlInfo = parseTrainingFromUrl();

      const [trainings, setTrainings] = useState(() => {
        let list = INITIAL_TRAININGS;
        try {
          const saved = localStorage.getItem(STORAGE_KEY);
          if (saved) {
            const parsed = JSON.parse(saved);
            if (Array.isArray(parsed) && parsed.length > 0) {
              list = parsed.map(t => ({
                ...t,
                staffList: (t.staffList || []).map(s =>
                  s.id === 10 && s.name === '김기민' ? { ...s, name: '박기민' } : s
                )
              }));
            }
          }
        } catch (e) {
          console.warn('LocalStorage error', e);
        }

        if (initialUrlInfo.trainingId) {
          const existing = list.find(t => t.id === initialUrlInfo.trainingId);
          if (!existing && initialUrlInfo.metadata) {
            const created = createSessionFromMetadata(initialUrlInfo.metadata);
            list = [created, ...list];
          }
        }
        return list;
      });

      const [currentView, setCurrentView] = useState(() => initialUrlInfo.targetView);
      const [activeTrainingId, setActiveTrainingId] = useState(() => {
        if (initialUrlInfo.trainingId) return initialUrlInfo.trainingId;
        return trainings[0]?.id || INITIAL_TRAININGS[0].id;
      });
      const [qrModalTrainingId, setQrModalTrainingId] = useState(null);

      useEffect(() => {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(trainings));
        } catch (e) {
          console.warn('LocalStorage save error', e);
        }
      }, [trainings]);

      // URL history change listener
      useEffect(() => {
        const handleUrlChange = () => {
          const info = parseTrainingFromUrl();
          if (info.trainingId) {
            setActiveTrainingId(info.trainingId);
            if (info.metadata) {
              setTrainings(prev => {
                if (!prev.some(t => t.id === info.trainingId)) {
                  return [createSessionFromMetadata(info.metadata), ...prev];
                }
                return prev;
              });
            }
            setCurrentView(info.targetView);
          } else if (info.targetView === 'dashboard') {
            setCurrentView('dashboard');
          }
        };

        window.addEventListener('popstate', handleUrlChange);
        window.addEventListener('hashchange', handleUrlChange);
        return () => {
          window.removeEventListener('popstate', handleUrlChange);
          window.removeEventListener('hashchange', handleUrlChange);
        };
      }, []);

      const activeTraining =
        trainings.find(t => t.id === activeTrainingId) ||
        (initialUrlInfo.metadata && initialUrlInfo.metadata.id === activeTrainingId
          ? createSessionFromMetadata(initialUrlInfo.metadata)
          : trainings[0] || INITIAL_TRAININGS[0]);

      const handleSelectTraining = (id, tab) => {
        setActiveTrainingId(id);
        setCurrentView(tab);
        window.scrollTo({ top: 0, behavior: 'smooth' });

        const cleanPath = window.location.pathname.endsWith('/')
          ? window.location.pathname
          : window.location.pathname + '/';
        const newUrl = `${cleanPath}?trainingId=${encodeURIComponent(id)}&view=${tab}#${tab}`;
        window.history.pushState(null, '', newUrl);
      };

      const handleBackToDashboard = () => {
        setCurrentView('dashboard');
        const cleanPath = window.location.pathname.endsWith('/')
          ? window.location.pathname
          : window.location.pathname + '/';
        window.history.pushState(null, '', cleanPath);
      };

      const handleCreateTraining = (data) => {
        const newTraining = {
          id: `training-${Date.now()}`,
          title: data.title,
          date: data.date,
          time: data.time || '15:30 ~ 16:30',
          location: data.location,
          school: '계촌중학교',
          target: data.target || '전 교직원',
          instructor: data.instructor || '',
          status: 'active',
          createdAt: Date.now(),
          staffList: BASE_STAFF_ROSTER.map(s => ({ ...s }))
        };

        setTrainings(prev => [newTraining, ...prev]);
        setActiveTrainingId(newTraining.id);
        setCurrentView('dashboard');
      };

      const handleDeleteTraining = (id) => {
        setTrainings(prev => prev.filter(t => t.id !== id));
        if (activeTrainingId === id) {
          const remaining = trainings.filter(t => t.id !== id);
          if (remaining.length > 0) setActiveTrainingId(remaining[0].id);
        }
      };

      const handleSaveSignature = (trainingId, staffId, signatureDataUrl) => {
        const now = new Date();
        const formattedDate = `${now.getFullYear()}.${String(now.getMonth() + 1).padStart(2, '0')}.${String(now.getDate()).padStart(2, '0')} ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;

        setTrainings(prev =>
          prev.map(t =>
            t.id === trainingId
              ? {
                  ...t,
                  staffList: t.staffList.map(s =>
                    s.id === staffId
                      ? { ...s, signature: signatureDataUrl, signedAt: formattedDate }
                      : s
                  )
                }
              : t
          )
        );
      };

      const handleAddNewStaffAndSign = (trainingId, newStaff, signatureDataUrl) => {
        const now = new Date();
        const formattedDate = `${now.getFullYear()}.${String(now.getMonth() + 1).padStart(2, '0')}.${String(now.getDate()).padStart(2, '0')} ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;

        setTrainings(prev =>
          prev.map(t => {
            if (t.id !== trainingId) return t;
            const nextId = t.staffList.length > 0 ? Math.max(...t.staffList.map(m => m.id)) + 1 : 1;
            const createdMember = {
              id: nextId,
              name: newStaff.name,
              department: newStaff.department || '교직원',
              position: newStaff.position || '교직원',
              signature: signatureDataUrl,
              signedAt: formattedDate
            };
            return {
              ...t,
              staffList: [...t.staffList, createdMember]
            };
          })
        );
      };

      const handleResetSignatures = (trainingId) => {
        setTrainings(prev =>
          prev.map(t =>
            t.id === trainingId
              ? {
                  ...t,
                  staffList: BASE_STAFF_ROSTER.map(s => ({ ...s }))
                }
              : t
          )
        );
      };

      const qrModalTraining = trainings.find(t => t.id === qrModalTrainingId) || null;

      return (
        <div className="min-h-screen bg-slate-100 text-slate-800 flex flex-col font-sans">
          {/* Header */}
          <header className="print:hidden sticky top-0 z-40 bg-white/95 backdrop-blur-md border-b border-slate-200 shadow-xs">
            <div className="max-w-6xl mx-auto px-4 sm:px-6 h-14 flex items-center justify-between">
              <div
                onClick={handleBackToDashboard}
                className="flex items-center gap-2.5 cursor-pointer hover:opacity-90 transition-opacity"
              >
                <div className="w-8 h-8 rounded-xl bg-indigo-600 flex items-center justify-center text-white shadow-xs">
                  <SchoolIcon className="w-4 h-4" />
                </div>
                <div>
                  <div className="text-xs font-bold text-slate-900 leading-tight flex items-center gap-1.5">
                    <span>계촌중학교 연수 등록부</span>
                    <span className="text-[10px] text-indigo-700 bg-indigo-50 border border-indigo-200 px-1.5 py-0.2 rounded font-semibold">
                      통합 포털
                    </span>
                  </div>
                  <p className="text-[10px] text-slate-400">교직원 연수 등록부 전자 관리 시스템</p>
                </div>
              </div>

              {/* View Switcher Tabs */}
              <div className="flex items-center bg-slate-100 p-1 rounded-xl border border-slate-200 gap-1 text-xs font-semibold">
                <button
                  onClick={handleBackToDashboard}
                  className={`flex items-center gap-1.5 px-3 py-1.5 rounded-lg transition-all ${
                    currentView === 'dashboard' ? 'bg-white text-indigo-600 shadow-xs' : 'text-slate-600 hover:text-slate-900'
                  }`}
                >
                  <LayersIcon className="w-3.5 h-3.5" />
                  <span>전체 연수 목록</span>
                </button>

                {currentView !== 'dashboard' && (
                  <>
                    <button
                      onClick={() => setCurrentView('sign')}
                      className={`flex items-center gap-1.5 px-3 py-1.5 rounded-lg transition-all ${
                        currentView === 'sign' ? 'bg-white text-indigo-600 shadow-xs' : 'text-slate-600 hover:text-slate-900'
                      }`}
                    >
                      <PenIcon className="w-3.5 h-3.5" />
                      <span>모바일 서명</span>
                    </button>

                    <button
                      onClick={() => setCurrentView('admin')}
                      className={`flex items-center gap-1.5 px-3 py-1.5 rounded-lg transition-all ${
                        currentView === 'admin' ? 'bg-white text-indigo-600 shadow-xs' : 'text-slate-600 hover:text-slate-900'
                      }`}
                    >
                      <TableIcon className="w-3.5 h-3.5" />
                      <span>등록부 확인 & 인쇄</span>
                    </button>
                  </>
                )}
              </div>

              <div className="flex items-center gap-2">
                {currentView !== 'dashboard' && activeTraining ? (
                  <button
                    onClick={() => setQrModalTrainingId(activeTraining.id)}
                    className="flex items-center gap-1.5 px-3 py-1.5 text-xs font-semibold text-slate-700 bg-slate-100 hover:bg-slate-200 rounded-xl border border-slate-200 transition-colors"
                  >
                    <QrCodeIcon className="w-4 h-4 text-indigo-600" />
                    <span className="hidden sm:inline">서명 QR</span>
                  </button>
                ) : (
                  <span className="text-xs text-slate-400 hidden sm:inline">
                    총 {trainings.length}개 연수 대장
                  </span>
                )}
              </div>
            </div>
          </header>

          {/* Main Content */}
          <main className="flex-1 w-full">
            {currentView === 'dashboard' && (
              <TrainingDashboard
                trainings={trainings}
                onSelectTraining={handleSelectTraining}
                onCreateTraining={handleCreateTraining}
                onDeleteTraining={handleDeleteTraining}
                onOpenQrModal={(id) => setQrModalTrainingId(id)}
              />
            )}

            {currentView === 'sign' && activeTraining && (
              <MobileSignView
                training={activeTraining}
                onBackToDashboard={handleBackToDashboard}
                onSaveSignature={handleSaveSignature}
                onAddNewStaffAndSign={handleAddNewStaffAndSign}
              />
            )}

            {currentView === 'admin' && activeTraining && (
              <AdminTableView
                training={activeTraining}
                allTrainings={trainings}
                onBackToDashboard={handleBackToDashboard}
                onResetSignatures={handleResetSignatures}
              />
            )}
          </main>

          <footer className="print:hidden py-5 border-t border-slate-200 text-center text-xs text-slate-400 bg-white">
            계촌중학교 · 교직원 연수등록부 통합 전자 관리 포털 시스템
          </footer>

          <QrShareModal
            isOpen={!!qrModalTrainingId}
            onClose={() => setQrModalTrainingId(null)}
            training={qrModalTraining}
            onNavigateToSign={(trainingId) => {
              setActiveTrainingId(trainingId);
              setCurrentView('sign');
            }}
          />
        </div>
      );
    }

    // Mount to DOM
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
