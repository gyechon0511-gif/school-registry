      constructor(props) {
        super(props);
        this.state = { hasError: false, error: null };
      }
      static getDerivedStateFromError(error) {
        return { hasError: true, error };
      }

        console.error('ErrorBoundary caught error:', error, info);

    const GyechonSchoolLogo = ({ className = 'w-16 h-16' }) => {
      const [customLogo, setCustomLogo] = useState(() => {
        try {
          return localStorage.getItem('gyechon_school_custom_logo_v1') || null;
        } catch {
          return null;
        }
      });

      useEffect(() => {
        const update = () => {
          try {
            setCustomLogo(localStorage.getItem('gyechon_school_custom_logo_v1') || null);
          } catch {}
        };
        window.addEventListener('gyechon-logo-updated', update);
        window.addEventListener('storage', update);

        // Fetch from server API if accessible
        try {
          fetch('/api/school-logo')
            .then(r => r.ok ? r.json() : null)
            .then(data => {
              if (data && data.success && data.customLogo) {
                try { localStorage.setItem('gyechon_school_custom_logo_v1', data.customLogo); } catch (e) {}
                setCustomLogo(data.customLogo);
              }
            })
            .catch(() => {});
        } catch (e) {}

        // Listen to Firestore real-time cloud doc settings/schoolLogo
        const attachCloudLogoListener = () => {
          if (window.__FIREBASE_DB__ && window.__FIREBASE_OPS__) {
            try {
              const { doc, onSnapshot } = window.__FIREBASE_OPS__;
              const logoRef = doc(window.__FIREBASE_DB__, 'settings', 'schoolLogo');

                if (snap.exists()) {

    // Helper to compress uploaded school logo to max 320px for single-file HTML
    function compressLogoImage(dataUrl, maxDim, callback) {
      if (!dataUrl || dataUrl.startsWith('data:image/svg')) {
        return callback(dataUrl);
      }
      try {
        var img = new Image();
        img.onload = function() {
          var w = img.width;
          var h = img.height;
          if (w > h) {
            if (w > maxDim) {
              h = Math.round((h * maxDim) / w);
              w = maxDim;
            }
          } else {
            if (h > maxDim) {
              w = Math.round((w * maxDim) / h);
              h = maxDim;
            }
          }
          w = Math.max(1, w);
          h = Math.max(1, h);
          var canvas = document.createElement('canvas');
          canvas.width = w;
          canvas.height = h;
          var ctx = canvas.getContext('2d');
          if (!ctx) return callback(dataUrl);
          ctx.imageSmoothingEnabled = true;
          ctx.imageSmoothingQuality = 'high';
          ctx.drawImage(img, 0, 0, w, h);
          try {
            var png = canvas.toDataURL('image/png');
            if (png.length < 150000) return callback(png);
            var jpeg = canvas.toDataURL('image/jpeg', 0.88);
            return callback(jpeg);
          } catch (e) {
            callback(dataUrl);
          }
        };
        img.onerror = function() { callback(dataUrl); };
        img.src = dataUrl;
      } catch (err) {
        callback(dataUrl);
      }
    }

    // Academic Year Helper
    // 현재 날짜의 월이 2월 이하이면 이전 학년도, 3월 이상이면 현재 학년도로 자동 계산
    function getCurrentAcademicYear(refDate = new Date()) {
      const year = refDate.getFullYear();
      const month = refDate.getMonth() + 1;
      const schoolYear = month <= 2 ? year - 1 : year;
      return schoolYear + '학년도';
    }

    function getAcademicYearFromDate(dateStr) {
      if (!dateStr || !dateStr.trim()) return getCurrentAcademicYear();
      const match = dateStr.match(/(d{4})[.-/년s]+(d{1,2})/);
      if (match) {
        const year = parseInt(match[1], 10);
        const month = parseInt(match[2], 10);
        if (!isNaN(year) && !isNaN(month)) {
          const schoolYear = month <= 2 ? year - 1 : year;
          return schoolYear + '학년도';
        }
      }
      return getCurrentAcademicYear();
    }

    function getKoreanTodayDateString() {
      const today = new Date();
      const days = ['일', '월', '화', '수', '목', '금', '토'];
      return today.getFullYear() + '. ' + (today.getMonth() + 1) + '. ' + today.getDate() + '.(' + days[today.getDay()] + ')';
    }

    function getAcademicYear(t) {
      if (!t) return getCurrentAcademicYear();
      if (t.academicYear && t.academicYear.trim()) return t.academicYear.trim();
      if (t.title) {
        const match = t.title.match(/(d{4})s*학년도/);
        if (match) return match[1] + '학년도';
      }
      if (t.date) {
        return getAcademicYearFromDate(t.date);
      }
      return getCurrentAcademicYear();
    }

    function getSelectableAcademicYears(trainings = [], additionalYear = '') {
      const curYear = getCurrentAcademicYear();
      const curNum = parseInt(curYear, 10);
      const set = new Set();
      set.add((curNum + 1) + '학년도');
      set.add(curNum + '학년도');
      for (let i = 1; i <= 5; i++) {
        set.add((curNum - i) + '학년도');
      }
      trainings.forEach(t => {
        const y = getAcademicYear(t);
        if (y) set.add(y);
      });
      if (additionalYear && additionalYear.trim()) {
        set.add(additionalYear.trim());
      }
      return Array.from(set).sort((a, b) => b.localeCompare(a));
    }

    function dateToISO(dateStr) {
      if (!dateStr || !dateStr.trim()) {
        const today = new Date();
        const y = today.getFullYear();
        const m = String(today.getMonth() + 1).padStart(2, '0');
        const d = String(today.getDate()).padStart(2, '0');
        return y + '-' + m + '-' + d;
      }
      const clean = dateStr.trim();
      if (/^d{4}-d{2}-d{2}$/.test(clean)) return clean;
      const match = clean.match(/(d{4})[.-/년s]+(d{1,2})[.-/월s]+(d{1,2})/);
      if (match) {
        const y = match[1];
        const m = String(parseInt(match[2], 10)).padStart(2, '0');
        const d = String(parseInt(match[3], 10)).padStart(2, '0');
        return y + '-' + m + '-' + d;
      }
      const today = new Date();
      return today.getFullYear() + '-' + String(today.getMonth() + 1).padStart(2, '0') + '-' + String(today.getDate()).padStart(2, '0');
    }

    function isoToKoreanDate(isoStr) {
      if (!isoStr || !isoStr.trim()) return '';
      const parts = isoStr.split('-');
      if (parts.length === 3) {
        const year = parseInt(parts[0], 10);
        const month = parseInt(parts[1], 10);
        const day = parseInt(parts[2], 10);
        const d = new Date(year, month - 1, day);
        if (!isNaN(d.getTime())) {
          const days = ['일', '월', '화', '수', '목', '금', '토'];
          return year + '. ' + month + '. ' + day + '.(' + days[d.getDay()] + ')';
        }
      }
      return isoStr;
    }

    function getTrainingDateTime(t) {
      if (t && t.date) {
        const match = t.date.match(/(d{4})[.-/년s]+(d{1,2})[.-/월s]+(d{1,2})/);
        if (match) {
          const year = parseInt(match[1], 10);
          const month = parseInt(match[2], 10) - 1;
          const day = parseInt(match[3], 10);
          let timestamp = new Date(year, month, day).getTime();
          if (t.time) {
            const timeMatch = t.time.match(/(d{1,2}):(d{2})/);
            if (timeMatch) {
              timestamp += (parseInt(timeMatch[1], 10) * 3600 + parseInt(timeMatch[2], 10) * 60) * 1000;
            }
          }
          return timestamp;
        }
      }
      return (t && t.createdAt) || 0;
    }

    function sortTrainingsByDateAscending(list) {
      if (!Array.isArray(list)) return [];
      return [...list].sort((a, b) => {
        const timeA = getTrainingDateTime(a);
        const timeB = getTrainingDateTime(b);
        if (timeA !== timeB) return timeA - timeB;
        return (a.createdAt || 0) - (b.createdAt || 0);
      });
    }

    async function forceBackupToFirebase(trigger = 'manual') {
      if (!window.__FIREBASE_DB__ || !window.__FIREBASE_OPS__) {
        throw new Error('Firebase 클라우드에 연결되지 않았습니다.');
      }
      const { doc, setDoc } = window.__FIREBASE_OPS__;
      const db = window.__FIREBASE_DB__;
      const now = new Date();
      const todayStr = getTodayDateString(now);
      const currentMeta = getStoredBackupMeta();

      let localTrainings = [];
      try {
        const raw = localStorage.getItem('school_training_sessions_v2');
        if (raw) localTrainings = JSON.parse(raw);
      } catch (e) {}
      if (!Array.isArray(localTrainings) || localTrainings.length === 0) {
        localTrainings = INITIAL_TRAININGS;
      }

      let localStatutory = [];
      try {
        const raw = localStorage.getItem('school_statutory_trainings_v1');
        if (raw) localStatutory = JSON.parse(raw);
      } catch (e) {}

      let customLogo = null;
      try {
        customLogo = localStorage.getItem('gyechon_school_custom_logo_v1');
      } catch (e) {}

      // 1. Force upload training sessions
      for (const t of localTrainings) {
        if (t && t.id) {
          await setDoc(doc(db, 'trainings', t.id), t, { merge: true });
        }
      }

      // 2. Force upload statutory training records
      for (const s of localStatutory) {
        if (s && s.id) {
          await setDoc(doc(db, 'statutoryTrainings', s.id), s, { merge: true });
        }
      }

      // 3. Force upload school emblem if exists
      if (customLogo) {
        await setDoc(doc(db, 'settings', 'schoolLogo'), {
          customLogo,
          updatedAt: Date.now()
        }, { merge: true });
      }

      // 4. Create snapshot in backups collection
      const backupDocId = 'backup_' + todayStr.replace(/-/g, '');
      await setDoc(doc(db, 'backups', backupDocId), {
        date: todayStr,
        timestamp: Date.now(),
        trigger,
        trainingsCount: localTrainings.length,
        statutoryCount: localStatutory.length,
        trainings: localTrainings,
        statutoryTrainings: localStatutory
      }, { merge: true });

      const newMeta = {
        lastBackupTime: Date.now(),
        lastBackupDate: todayStr,
        designatedTime: currentMeta.designatedTime || '00:00',
        trainingsCount: localTrainings.length,
        statutoryCount: localStatutory.length,
        status: 'success',
        message: todayStr + ' ' + now.toLocaleTimeString('ko-KR') + ' Firebase 강제 백업 완료 (연수 ' + localTrainings.length + '건, 법정연수 ' + localStatutory.length + '건)',
        trigger
      };

      localStorage.setItem(BACKUP_META_STORAGE_KEY, JSON.stringify(newMeta));
      await setDoc(doc(db, 'settings', 'backup_status'), newMeta, { merge: true });
      window.dispatchEvent(new CustomEvent('backup-scheduler-updated', { detail: newMeta }));
      return newMeta;
    }

    // --- URL Helper: Bulletproof QR Code target & URL state parser ---
    function buildQrTargetUrl(training) {
      try {
        const origin = window.location.origin;
        let pathname = window.location.pathname || '/';
        if (!pathname.endsWith('/') && !pathname.includes('.')) {
          pathname = pathname + '/';
        }
        const cleanBase = origin + pathname;
        const params = new URLSearchParams();
        params.set('trainingId', training.id);
        params.set('view', 'sign');
        params.set('title', training.title);
        params.set('date', training.date);
        if (training.time) params.set('time', training.time);
        params.set('loc', training.location);
        if (training.school) params.set('school', training.school);
        if (training.instructor) params.set('inst', training.instructor);
        if (training.target) params.set('target', training.target);

        return `${cleanBase}?${params.toString()}#sign`;
      } catch (e) {
        return `${window.location.origin}/?trainingId=${encodeURIComponent(training.id)}&view=sign#sign`;
      }
    }

    function parseTrainingFromUrl() {
      try {
        const searchParams = new URLSearchParams(window.location.search);
        const hash = window.location.hash || '';
        let hashParams = new URLSearchParams();
        if (hash.includes('?')) {
          hashParams = new URLSearchParams(hash.split('?')[1]);
        }

        const trainingId =
          searchParams.get('trainingId') ||
          searchParams.get('id') ||
          searchParams.get('tid') ||
          hashParams.get('trainingId') ||
          hashParams.get('id') ||
          hashParams.get('tid') ||
          (hash.startsWith('#sign-') ? hash.replace('#sign-', '') : null) ||
          (hash.startsWith('#training-') ? hash.replace('#', '') : null) ||
          null;

        const viewParam = (
          searchParams.get('view') ||
          hashParams.get('view') ||
          ''
        ).toLowerCase();

        let targetView = 'dashboard';
        if (viewParam === 'admin' || hash.includes('admin')) {
          targetView = 'admin';
        } else if (viewParam === 'sign' || hash.includes('sign') || Boolean(trainingId)) {
          targetView = 'sign';
        }

        let metadata = null;
        const title = searchParams.get('title') || hashParams.get('title');
        if (trainingId && title) {
          metadata = {
            id: trainingId,
            title: title,
            date: searchParams.get('date') || hashParams.get('date') || '',
            time: searchParams.get('time') || hashParams.get('time') || '15:30 ~ 16:30',
            location: searchParams.get('loc') || searchParams.get('location') || '도서관',
            school: searchParams.get('school') || '계촌중학교',
            instructor: searchParams.get('inst') || searchParams.get('instructor') || '',
            target: searchParams.get('target') || '전 교직원',
            status: 'active',
            createdAt: Date.now()
          };
        }

        return { trainingId, targetView, metadata };
      } catch (e) {
        return { trainingId: null, targetView: 'dashboard', metadata: null };
      }
    }

    function MobileSignView({ training, onBackToDashboard, onNavigateToStatutory, onSaveSignature, onAddNewStaffAndSign }) {
      const [signMode, setSignMode] = useState('existing');
      const [selectedStaffId, setSelectedStaffId] = useState('');
      const [customName, setCustomName] = useState('');
      const [customDept, setCustomDept] = useState('');
      const [customPos, setCustomPos] = useState('');
      const [strokeColor, setStrokeColor] = useState('#0f172a');
      const [hasDrawn, setHasDrawn] = useState(false);
      const [submitSuccess, setSubmitSuccess] = useState(false);

      const canvasRef = useRef(null);
      const isDrawingRef = useRef(false);
      const lastPointRef = useRef(null);

      const staffList = training.staffList || [];
      const selectedMember = staffList.find(s => s.id === Number(selectedStaffId));

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        if (!ctx) return;

        const resize = () => {
          const rect = canvas.getBoundingClientRect();
          const dpr = window.devicePixelRatio || 1;
          canvas.width = rect.width * dpr;
          canvas.height = rect.height * dpr;
          ctx.scale(dpr, dpr);
          ctx.lineCap = 'round';
          ctx.lineJoin = 'round';
        };

        resize();
        window.addEventListener('resize', resize);
        return () => window.removeEventListener('resize', resize);
      }, []);

      const getCanvasCoords = (e) => {
        const canvas = canvasRef.current;
        if (!canvas) return { x: 0, y: 0 };
        const rect = canvas.getBoundingClientRect();
        let clientX = 0;
        let clientY = 0;

        if (e.touches) {
          if (e.touches.length > 0) {
            clientX = e.touches[0].clientX;
            clientY = e.touches[0].clientY;
          } else if (e.changedTouches && e.changedTouches.length > 0) {
            clientX = e.changedTouches[0].clientX;
            clientY = e.changedTouches[0].clientY;
          }
        } else {
          clientX = e.clientX;
          clientY = e.clientY;
        }

        return { x: clientX - rect.left, y: clientY - rect.top };
      };

      const startDrawing = (e) => {
        if (signMode === 'existing' && (!selectedMember || selectedMember.signature)) return;
        isDrawingRef.current = true;
        const p = getCanvasCoords(e);
        lastPointRef.current = p;
        setHasDrawn(true);
      };

      const draw = (e) => {
        if (!isDrawingRef.current || !canvasRef.current) return;
        if (e.touches) e.preventDefault();

        const ctx = canvasRef.current.getContext('2d');
        if (!ctx) return;
        const currentPoint = getCanvasCoords(e);
        const lastPoint = lastPointRef.current || currentPoint;

        ctx.strokeStyle = strokeColor;
        ctx.lineWidth = 3;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        ctx.beginPath();
        ctx.moveTo(lastPoint.x, lastPoint.y);
        ctx.lineTo(currentPoint.x, currentPoint.y);
        ctx.stroke();

        lastPointRef.current = currentPoint;
      };

      const stopDrawing = () => {
        isDrawingRef.current = false;
        lastPointRef.current = null;
      };

      const clearCanvas = () => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        if (!ctx) return;
        const dpr = window.devicePixelRatio || 1;
        ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
        setHasDrawn(false);
      };

      const handleSubmit = () => {
        if (!hasDrawn || !canvasRef.current) {
          alert('서명 패드에 본인의 서명을 작성해주세요.');
          return;
        }
        const signatureDataUrl = canvasRef.current.toDataURL('image/png');

        if (signMode === 'custom') {
          if (!customName.trim()) {
            alert('성명을 입력해주세요.');
            return;
          }
          onAddNewStaffAndSign(
            training.id,
            {
              name: customName.trim(),
              department: customDept.trim() || '교직원',
              position: customPos.trim() || '교직원'
            },
            signatureDataUrl
          );
          setCustomName('');
          setCustomDept('');
          setCustomPos('');
          clearCanvas();
          setSubmitSuccess(true);
          setTimeout(() => setSubmitSuccess(false), 4000);
          return;
        }

        if (!selectedMember) {
          alert('교직원 본인 이름을 먼저 선택해주세요.');
          return;
        }
        if (selectedMember.signature) {
          alert('이미 서명이 완료된 교직원입니다.');
          return;
        }

        onSaveSignature(training.id, selectedMember.id, signatureDataUrl);
        setSubmitSuccess(true);
        clearCanvas();
        setTimeout(() => setSubmitSuccess(false), 4000);
      };

      const signedCount = staffList.filter(s => !!s.signature).length;

      return (
        <div className="max-w-lg mx-auto p-4 sm:p-6 pb-20 space-y-4">
          <div className="flex items-center justify-between gap-2">
            <button
              onClick={onBackToDashboard}
              className="flex items-center gap-1.5 text-xs font-semibold text-slate-600 hover:text-indigo-600 transition-colors bg-white px-3 py-2 rounded-xl border border-slate-200 shadow-xs cursor-pointer"
            >
              <ArrowLeftIcon className="w-4 h-4" />
              <span>전체 연수 목록</span>
            </button>

            <button
              onClick={() => {
                if (onNavigateToStatutory) {
                  onNavigateToStatutory();
                } else {
                  window.location.hash = 'statutory';
                  onBackToDashboard();
                }
              }}
              className="flex items-center gap-1.5 text-xs font-bold text-emerald-800 bg-emerald-50 hover:bg-emerald-100 px-3 py-2 rounded-xl border border-emerald-200 shadow-xs transition-colors cursor-pointer"
            >
              <GraduationCapIcon className="w-4 h-4 text-emerald-600" />
              <span>법정연수 대장 보기</span>
            </button>
          </div>

          {/* Training Info Card with School Emblem */}

            <div className="flex items-center justify-between gap-3 border-b border-slate-100 pb-3 mb-3">
              <div className="flex items-center gap-2.5">
                <GyechonSchoolLogo className="w-11 h-11 object-contain drop-shadow-xs shrink-0" />
                <div>
                  <div className="text-xs font-bold text-slate-900 leading-tight">
                    {training.school}
                  </div>
                  <span className="text-[10px] text-indigo-700 bg-indigo-50 border border-indigo-200 px-1.5 py-0.2 rounded font-semibold inline-block mt-0.5">
                    교직원 연수 모바일 전자서명
                  </span>
                </div>
              </div>
              <div className="text-right">
                <span className="text-[10px] text-slate-400 block font-medium">서명 현황</span>
                <span className="text-xs font-bold text-indigo-700">
                  {signedCount} <span className="text-slate-400 font-normal">/ {staffList.length}명</span>

    // ==========================================
    // Component: Scanned Paper Registry Section
    // ==========================================
    function ScannedRegistrySection({ trainingTitle, scannedFiles = [], onUpdateFiles }) {
      const [previewFile, setPreviewFile] = useState(null);
      const fileInputRef = useRef(null);

      const handleFileChange = (e) => {
        const files = e.target.files;
        if (!files || files.length === 0) return;
        const newFiles = [...scannedFiles];
        const now = new Date();
        const dateStr = now.getFullYear() + '. ' + (now.getMonth() + 1) + '. ' + now.getDate() + '.';

        Array.from(files).forEach((file) => {
          const reader = new FileReader();
          reader.onload = (evt) => {
            newFiles.push({
              id: 'scan-' + Date.now() + '-' + Math.random().toString(36).substring(2, 6),
              name: file.name,
              size: file.size,
              type: file.type || 'application/pdf',
              dataUrl: evt.target.result,
              uploadedAt: dateStr
            });
            onUpdateFiles([...newFiles]);
          };
          reader.readAsDataURL(file);
        });
        if (fileInputRef.current) fileInputRef.current.value = '';
      };

      const handleDelete = (id, name) => {
        if (window.confirm('"' + name + '" 스캔본을 삭제하시겠습니까?')) {
          onUpdateFiles(scannedFiles.filter(f => f.id !== id));
          if (previewFile && previewFile.id === id) setPreviewFile(null);
        }
      };

      const handleDownload = (file) => {
        const a = document.createElement('a');
        a.href = file.dataUrl;
        a.download = file.name;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
      };

      return (
        <div className="bg-white rounded-2xl p-5 shadow-sm border border-slate-200 space-y-4 print:hidden">
          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3 pb-3 border-b border-slate-100">
            <div className="flex items-center gap-2.5">
              <div className="w-9 h-9 rounded-xl bg-amber-500/10 flex items-center justify-center text-amber-600">
                <FileCheck2Icon className="w-5 h-5" />
              </div>
              <div>
                <div className="flex items-center gap-2">
                  <h3 className="text-sm font-bold text-slate-900">종이 등록부 스캔본 보관 / 관리</h3>
                  <span className={`text-[11px] px-2 py-0.5 rounded-full font-bold ${
                    scannedFiles.length > 0 ? 'bg-emerald-50 text-emerald-700 border border-emerald-200' : 'bg-slate-100 text-slate-500'
                  }`}>
                    {scannedFiles.length > 0 ? `스캔본 ${scannedFiles.length}건 보관중` : '미등록'}
                  </span>
                </div>
                <p className="text-xs text-slate-500 mt-0.5">
                  서면(종이)으로 직접 서명받은 연수등록부 스캔본이나 스마트폰 촬영본을 올려 보관합니다.
                </p>
              </div>
            </div>

            <div>
              <input
                type="file"
                ref={fileInputRef}
                onChange={handleFileChange}
                accept="image/*,.pdf"
                multiple
                className="hidden"
              />
              <button
                onClick={() => fileInputRef.current && fileInputRef.current.click()}
                className="flex items-center gap-2 px-3.5 py-2 rounded-xl text-xs font-bold text-white bg-amber-600 hover:bg-amber-500 transition-all shadow-xs"
              >
                <UploadIcon className="w-3.5 h-3.5" />
                <span>스캔본 파일 올리기</span>
              </button>
            </div>
          </div>

          {scannedFiles.length === 0 ? (
            <div
              onClick={() => fileInputRef.current && fileInputRef.current.click()}
              className="border-2 border-dashed border-slate-200 hover:border-amber-400 bg-slate-50/60 rounded-xl p-5 text-center cursor-pointer transition-all"
            >
              <div className="text-xs font-bold text-slate-700">종이 등록부 스캔본(사진 또는 PDF)을 등록해 보세요</div>
              <div className="text-[11px] text-slate-400 mt-1">클릭하여 스캔 이미지나 PDF 파일을 첨부할 수 있습니다.</div>
            </div>
          ) : (
            <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3">
              {scannedFiles.map((file) => (
                <div key={file.id} className="border border-slate-200 rounded-xl p-3 bg-slate-50/50 flex flex-col justify-between">
                  <div className="flex items-start gap-2.5">
                    <div 
                      onClick={() => setPreviewFile(file)}
                      className="w-12 h-14 bg-slate-200 rounded-lg overflow-hidden shrink-0 cursor-pointer border border-slate-300 flex items-center justify-center"
                    >
                      {file.type && file.type.startsWith('image/') ? (
                        <img src={file.dataUrl} alt={file.name} className="w-full h-full object-cover" />
                      ) : (
                        <FileTextIcon className="w-6 h-6 text-rose-500" />
                      )}
                    </div>
                    <div className="flex-1 min-w-0">
                      <div onClick={() => setPreviewFile(file)} className="text-xs font-bold text-slate-800 truncate hover:text-amber-700 cursor-pointer">
                        {file.name}
                      </div>
                      <div className="text-[11px] text-slate-400 mt-0.5">{file.uploadedAt}</div>
                    </div>
                  </div>
                  <div className="flex items-center justify-end gap-1.5 mt-2 pt-2 border-t border-slate-100 text-xs">
                    <button onClick={() => setPreviewFile(file)} className="p-1 rounded text-slate-600 hover:text-indigo-600" title="크게 보기">
                      <EyeIcon className="w-3.5 h-3.5" />
                    </button>
                    <button onClick={() => handleDownload(file)} className="p-1 rounded text-slate-600 hover:text-emerald-600" title="다운로드">
                      <DownloadIcon className="w-3.5 h-3.5" />
                    </button>
                    <button onClick={() => handleDelete(file.id, file.name)} className="p-1 rounded text-slate-400 hover:text-rose-600" title="삭제">
                      <Trash2Icon className="w-3.5 h-3.5" />
                    </button>
                  </div>
                </div>
              ))}
            </div>
          )}

          {previewFile && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/80 backdrop-blur-xs">
              <div className="bg-white rounded-2xl w-full max-w-3xl max-h-[90vh] flex flex-col shadow-2xl overflow-hidden">
                <div className="p-3.5 bg-slate-900 text-white flex items-center justify-between">
                  <div className="text-xs font-bold truncate max-w-sm">{previewFile.name}</div>
                  <div className="flex items-center gap-2">
                    <button onClick={() => handleDownload(previewFile)} className="px-2.5 py-1 rounded bg-white/10 hover:bg-white/20 text-xs">다운로드</button>
                    <button onClick={() => setPreviewFile(null)} className="p-1 rounded bg-white/10 hover:bg-white/20 text-slate-300">
                      <XIcon className="w-4 h-4" />
                    </button>
                  </div>
                </div>
                <div className="flex-1 overflow-auto p-4 bg-slate-100 flex items-center justify-center min-h-[350px]">
                  {previewFile.type && previewFile.type.startsWith('image/') ? (
                    <img src={previewFile.dataUrl} alt={previewFile.name} className="max-w-full max-h-[70vh] object-contain rounded bg-white" />
                  ) : (
                    <iframe src={previewFile.dataUrl} title={previewFile.name} className="w-full h-[65vh] rounded bg-white border" />
                  )}
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

        return () => document.removeEventListener('mousedown', handleClickOutside);

        window.print();

    // ==========================================
    // Component 2.5: Statutory Training View (Single-File HTML)
    // ==========================================
    const COMMON_CYBER_SITES = [
      '강원교육온',
      '중앙교육연수원',
      '강원특별자치도교육청교육연수원',
      '나라배움터 (국가공무원인재개발원)',
      '한국보건복지인재원',
      '국민권익위원회 청렴연수원',
      '학교안전공제중앙회 (안전교육)',
      '한국양성평등교육진흥원'
    ];

    const COMMON_COURSES = [
      '(교원/상시)학교지원 법정의무교육 직무연수 1',
      '(교원/상시) 학교지원 법정의무교육 직무연수 2',
      '아동학대 예방 및 신고의무자 교육',
      '긴급복지 신고의무자 기본과정',
      '직장 내 장애인식 개선교육',
      '직장 내 4대 폭력 예방교육',
      '개인정보보호 및 정보보안 실천 교육',
      '청렴 및 부패방지 교육',
      '학교 안전 및 재난예방 안전교육',
      '심폐소생술(CPR) 및 응급처치 원격교육'
    ];

    function StatutoryTrainingView({ records = [], onAddRecord, onUpdateRecord, onDeleteRecord, onOpenLogoModal }) {
      const currentAcademicYear = getCurrentAcademicYear();
      const [selectedYear, setSelectedYear] = useState('all');
      const [searchQuery, setSearchQuery] = useState('');
      const [selectedStaffFilter, setSelectedStaffFilter] = useState('all');

      const [isEditModalOpen, setIsEditModalOpen] = useState(false);
      const [editingRecord, setEditingRecord] = useState(null);

      const [viewerRecord, setViewerRecord] = useState(null);
      const [activeCertIndex, setActiveCertIndex] = useState(0);

      const [attachTargetRecord, setAttachTargetRecord] = useState(null);
      const attachFileInputRef = useRef(null);

      const [formAcademicYear, setFormAcademicYear] = useState(currentAcademicYear);
      const [formStaffName, setFormStaffName] = useState(BASE_STAFF_ROSTER[1]?.name || '하영수');
      const [formStaffPosition, setFormStaffPosition] = useState(BASE_STAFF_ROSTER[1]?.position || '교무부장');
      const [formStaffDept, setFormStaffDept] = useState(BASE_STAFF_ROSTER[1]?.department || '교무실');
      const [formCyberSite, setFormCyberSite] = useState('중앙교육연수원');
      const [formCourseName, setFormCourseName] = useState('');
      const [formTrainingPeriod, setFormTrainingPeriod] = useState('');
      const [formCompletionNumber, setFormCompletionNumber] = useState('');
      const [formCompletionDate, setFormCompletionDate] = useState('');
      const [completionDateISO, setCompletionDateISO] = useState('');
      const [periodStartISO, setPeriodStartISO] = useState('');
      const [periodEndISO, setPeriodEndISO] = useState('');
      const [formHours, setFormHours] = useState('15시간');
      const [formNote, setFormNote] = useState('');
      const [formFiles, setFormFiles] = useState([]);

      const periodStartInputRef = useRef(null);
      const periodEndInputRef = useRef(null);
      const completionDateInputRef = useRef(null);

      const formatIsoToDotDate = (iso) => {
        if (!iso) return '';
        const parts = iso.split('-');
        if (parts.length === 3) {
          return parts[0] + '. ' + parts[1] + '. ' + parts[2] + '.';
        }
        return iso;
      };

      const handlePeriodStartChange = (iso) => {
        setPeriodStartISO(iso);
        const startDot = formatIsoToDotDate(iso);
        const endDot = formatIsoToDotDate(periodEndISO);
        if (startDot && endDot) {
          setFormTrainingPeriod(startDot + ' ~ ' + endDot);
        } else if (startDot) {
          setFormTrainingPeriod(startDot);
        }
      };

      const handlePeriodEndChange = (iso) => {
        setPeriodEndISO(iso);
        const startDot = formatIsoToDotDate(periodStartISO);
        const endDot = formatIsoToDotDate(iso);
        if (startDot && endDot) {
          setFormTrainingPeriod(startDot + ' ~ ' + endDot);
        } else if (endDot) {
          setFormTrainingPeriod(endDot);
        }
        if (!completionDateISO || completionDateISO === periodEndISO) {
          setCompletionDateISO(iso);
          setFormCompletionDate(endDot);
        }
      };

      const handleCompletionDateChange = (iso) => {
        setCompletionDateISO(iso);
        setFormCompletionDate(formatIsoToDotDate(iso));
      };

      const openDatePicker = (ref) => {
        try {
          if (ref.current && typeof ref.current.showPicker === 'function') {
            ref.current.showPicker();
          } else {
            ref.current?.focus();
          }
        } catch (e) {
          ref.current?.focus();
        }
      };

      const academicYears = useMemo(() => {
        const set = new Set(records.map(r => r.academicYear || currentAcademicYear));
        set.add(currentAcademicYear);
        return Array.from(set).sort().reverse();
      }, [records, currentAcademicYear]);

      const filteredRecords = useMemo(() => {
        return records.filter(rec => {
          if (selectedYear !== 'all' && rec.academicYear !== selectedYear) return false;
          if (selectedStaffFilter !== 'all' && rec.staffName !== selectedStaffFilter) return false;
          if (searchQuery.trim()) {
            const q = searchQuery.toLowerCase().trim();
            const matchStaff = rec.staffName.toLowerCase().includes(q);
            const matchCourse = rec.courseName.toLowerCase().includes(q);
            const matchSite = rec.cyberSite.toLowerCase().includes(q);
            const matchNum = rec.completionNumber.toLowerCase().includes(q);
            if (!matchStaff && !matchCourse && !matchSite && !matchNum) return false;
          }
          return true;
        });
      }, [records, selectedYear, selectedStaffFilter, searchQuery]);

      const totalCount = filteredRecords.length;
      const attachedCertCount = filteredRecords.filter(r => (r.certificateFiles && r.certificateFiles.length) > 0).length;
      const distinctStaffCount = new Set(filteredRecords.map(r => r.staffName)).size;
      const certAttachmentRate = totalCount > 0 ? Math.round((attachedCertCount / totalCount) * 100) : 0;

      const handleOpenCreateModal = () => {
        setEditingRecord(null);
        setFormAcademicYear(selectedYear !== 'all' ? selectedYear : currentAcademicYear);
        const defaultStaff = BASE_STAFF_ROSTER[1] || BASE_STAFF_ROSTER[0];
        setFormStaffName(defaultStaff.name);
        setFormStaffPosition(defaultStaff.position);
        setFormStaffDept(defaultStaff.department);
        setFormCyberSite('중앙교육연수원');
        setFormCourseName('아동학대 예방 및 신고의무자 교육');
        const today = new Date();
        const y = today.getFullYear();
        const m = String(today.getMonth() + 1).padStart(2, '0');
        setPeriodStartISO(y + '-' + m + '-01');
        setPeriodEndISO(y + '-' + m + '-15');
        setCompletionDateISO(y + '-' + m + '-15');
        setFormTrainingPeriod(y + '. ' + m + '. 01. ~ ' + y + '. ' + m + '. 15.');
        setFormCompletionNumber('제' + y + '-중앙-' + Math.floor(1000 + Math.random() * 9000) + '호');
        setFormCompletionDate(y + '. ' + m + '. 15.');
        setFormHours('15시간');
        setFormNote('');
        setFormFiles([]);
        setIsEditModalOpen(true);
      };

      const handleOpenEditModal = (rec) => {
        setEditingRecord(rec);
        setFormAcademicYear(rec.academicYear || currentAcademicYear);
        setFormStaffName(rec.staffName);
        setFormStaffPosition(rec.staffPosition || '');
        setFormStaffDept(rec.staffDepartment || '');
        setFormCyberSite(rec.cyberSite);
        setFormCourseName(rec.courseName);
        setFormTrainingPeriod(rec.trainingPeriod);
        const periodParts = (rec.trainingPeriod || '').split('~');
        if (periodParts.length >= 2) {
          setPeriodStartISO(dateToISO(periodParts[0]));
          setPeriodEndISO(dateToISO(periodParts[1]));
        } else {
          setPeriodStartISO(dateToISO(rec.trainingPeriod || ''));
          setPeriodEndISO('');
        }
        setCompletionDateISO(dateToISO(rec.completionDate || ''));
        setFormCompletionNumber(rec.completionNumber);
        setFormCompletionDate(rec.completionDate || '');
        setFormHours(rec.hours ? '' + rec.hours : '');
        setFormNote(rec.note || '');
        setFormFiles(rec.certificateFiles ? [...rec.certificateFiles] : []);
        setIsEditModalOpen(true);
      };

      const handleStaffSelect = (name) => {
        setFormStaffName(name);
        const found = BASE_STAFF_ROSTER.find(s => s.name === name);
        if (found) {
          setFormStaffPosition(found.position);
          setFormStaffDept(found.department);
        }
      };

      const handleFileUpload = (e) => {
        const files = e.target.files;
        if (!files || files.length === 0) return;
        Array.from(files).forEach(file => {
          const reader = new FileReader();
          reader.onload = (event) => {
            const dataUrl = event.target?.result;
            if (dataUrl) {
              const newFile = {
                id: 'cert-' + Date.now() + '-' + Math.random().toString(36).slice(2, 7),
                name: file.name,
                size: file.size,
                type: file.type || 'image/jpeg',
                dataUrl,
                uploadedAt: new Date().toLocaleString('ko-KR')
              };
              setFormFiles(prev => [...prev, newFile]);
            }
          };
          reader.readAsDataURL(file);
        });
        e.target.value = '';
      };

      const handleSaveRecord = (e) => {
        e.preventDefault();
        if (!formStaffName.trim() || !formCourseName.trim() || !formCyberSite.trim()) {
          alert('교직원 성명, 과정명, 사이버교육사이트는 필수 항목입니다.');
          return;
        }

        if (editingRecord) {
          onUpdateRecord({
            ...editingRecord,
            academicYear: formAcademicYear,
            staffName: formStaffName.trim(),
            staffPosition: formStaffPosition.trim(),
            staffDepartment: formStaffDept.trim(),
            cyberSite: formCyberSite.trim(),
            courseName: formCourseName.trim(),
            trainingPeriod: formTrainingPeriod.trim(),
            completionNumber: formCompletionNumber.trim(),
            completionDate: formCompletionDate.trim(),
            hours: formHours.trim(),
            note: formNote.trim(),
            certificateFiles: formFiles,
            updatedAt: Date.now()
          });
        } else {
          onAddRecord({
            academicYear: formAcademicYear,
            staffName: formStaffName.trim(),
            staffPosition: formStaffPosition.trim(),
            staffDepartment: formStaffDept.trim(),
            cyberSite: formCyberSite.trim(),
            courseName: formCourseName.trim(),
            trainingPeriod: formTrainingPeriod.trim(),
            completionNumber: formCompletionNumber.trim(),
            completionDate: formCompletionDate.trim(),
            hours: formHours.trim(),
            note: formNote.trim(),
            certificateFiles: formFiles
          });
        }
        setIsEditModalOpen(false);
      };

      const handleQuickAttachFiles = (e) => {
        if (!attachTargetRecord) return;
        const files = e.target.files;
        if (!files || files.length === 0) return;
        const existingFiles = attachTargetRecord.certificateFiles || [];
        const newFiles = [];
        let processed = 0;
        Array.from(files).forEach(file => {
          const reader = new FileReader();
          reader.onload = (event) => {
            const dataUrl = event.target?.result;
            if (dataUrl) {
              newFiles.push({
                id: 'cert-' + Date.now() + '-' + Math.random().toString(36).slice(2, 7),
                name: file.name,
                size: file.size,
                type: file.type || 'image/jpeg',
                dataUrl,
                uploadedAt: new Date().toLocaleString('ko-KR')
              });
            }
            processed++;
            if (processed === files.length) {
              onUpdateRecord({
                ...attachTargetRecord,
                certificateFiles: [...existingFiles, ...newFiles],
                updatedAt: Date.now()
              });
              setAttachTargetRecord(null);
            }
          };
          reader.readAsDataURL(file);
        });
        e.target.value = '';
      };

      return (
        <div className="space-y-6">
          {/* Top Banner */}
          <div className="relative overflow-hidden rounded-3xl bg-gradient-to-r from-teal-900 via-emerald-800 to-slate-900 bg-emerald-900 p-6 sm:p-8 text-white shadow-xl">

                  <GraduationCapIcon className="w-3.5 h-3.5" />
                  <span>법정의무연수 이수 및 종이이수증 스캔본 관리대장</span>
                </div>
                <h2 className="text-2xl sm:text-3xl font-extrabold tracking-tight text-white">
                  계촌중학교 법정연수 이수 관리대장
                </h2>
                <p className="text-sm text-emerald-100/90 leading-relaxed">
                  교직원의 사이버교육 이수 내역(교육사이트, 과정명, 교육기간, 이수번호)을 체계적으로 등록하고, 제출된 종이이수증을 스캔·촬영하여 전자 보관 및 증빙합니다.
                </p>
              </div>

              <div className="flex flex-col sm:flex-row items-stretch sm:items-center gap-3 shrink-0">
                <button
                  onClick={() => exportStatutoryTrainingsToExcel(filteredRecords, selectedYear)}
                  className="flex items-center justify-center gap-2 px-4 py-2.5 rounded-2xl bg-white/10 hover:bg-white/20 text-white font-bold text-xs sm:text-sm border border-white/20 shadow-sm active:scale-95 transition-all"
                  title="현재 법정의무연수 관리대장을 Excel(.xlsx)로 다운로드"
                >
                  <FileSpreadsheetIcon className="w-4 h-4 text-emerald-300" />
                  <span>법정연수 대장 Excel 다운로드</span>
                </button>

    // ==========================================

    // ==========================================
    function TrainingDashboard({
      trainings,
      onSelectTraining,
      onCreateTraining,
      onEditTraining,
      onDeleteTraining,
      onOpenQrModal,
      onOpenLogoModal,
      statutoryTrainings = [],
      onAddStatutoryRecord,
      onUpdateStatutoryRecord,
      onDeleteStatutoryRecord,
      activeTab,
      onTabChange
    }) {
      const [internalTab, setInternalTab] = useState('sessions');
      const activeDashboardTab = activeTab !== undefined ? activeTab : internalTab;
      const setActiveDashboardTab = (tab) => {
        setInternalTab(tab);
        if (onTabChange) onTabChange(tab);
      };
      const [isModalOpen, setIsModalOpen] = useState(false);
      const [selectedAcademicYear, setSelectedAcademicYear] = useState('all');
      const [viewMode, setViewMode] = useState('table');

      const [newAcademicYear, setNewAcademicYear] = useState(() => getCurrentAcademicYear());
      const [newTitle, setNewTitle] = useState('');
      const [newDateISO, setNewDateISO] = useState(() => dateToISO());
      const [newDate, setNewDate] = useState(() => getKoreanTodayDateString());
      const [newTime, setNewTime] = useState('15:30 ~ 16:30');
      const [newLocation, setNewLocation] = useState('2층 도서관');
      const [newInstructor, setNewInstructor] = useState('');
      const [newTarget, setNewTarget] = useState('전 교직원');

      const handleDateChange = (iso) => {
        setNewDateISO(iso);
        const koreanDate = isoToKoreanDate(iso);
        setNewDate(koreanDate);
        const matched = getAcademicYearFromDate(koreanDate);
        if (matched) setNewAcademicYear(matched);
      };

      const availableYears = useMemo(() => {
        const set = new Set();
        trainings.forEach(t => set.add(getAcademicYear(t)));
        const curNum = parseInt(getCurrentAcademicYear(), 10);
        set.add(curNum + '학년도');
        set.add((curNum - 1) + '학년도');
        return Array.from(set).sort((a, b) => b.localeCompare(a));
      }, [trainings]);

      const filteredTrainings = useMemo(() => {
        const list = selectedAcademicYear === 'all'
          ? trainings
          : trainings.filter(t => getAcademicYear(t) === selectedAcademicYear);
        return [...list].sort((a, b) => getTrainingDateTime(a) - getTrainingDateTime(b));
      }, [trainings, selectedAcademicYear]);

      const totalScannedFiles = useMemo(() => {
        return trainings.reduce((acc, t) => acc + ((t.scannedFiles && t.scannedFiles.length) || 0), 0);
      }, [trainings]);

      const handleCreateSubmit = (e) => {
        e.preventDefault();
        if (!newTitle.trim()) {
          alert('연수 제목을 입력해주세요.');
          return;
        }
        onCreateTraining({
          title: newTitle.trim(),
          date: newDate.trim(),
          time: newTime.trim(),
          location: newLocation.trim() || '2층 도서관',
          instructor: newInstructor.trim(),
          target: newTarget.trim() || '전 교직원',
          academicYear: newAcademicYear.trim() || (newDate ? getAcademicYearFromDate(newDate) : getCurrentAcademicYear())
        });
        setNewTitle('');
        setIsModalOpen(false);
      };

      return (
        <div className="max-w-6xl mx-auto p-4 sm:p-8 space-y-7">
          {/* Top Tab Switcher */}
          <div className="flex flex-wrap items-center justify-between gap-3 border-b border-slate-200/90 pb-3">
            <div className="flex items-center gap-1.5 p-1 bg-slate-100/90 rounded-2xl border border-slate-200 shadow-xs">
              <button
                type="button"
                onClick={() => setActiveDashboardTab('sessions')}
                className={
                  "flex items-center gap-2 px-4 py-2 rounded-xl text-xs sm:text-sm font-extrabold transition-all cursor-pointer " +
                  (activeDashboardTab === 'sessions'
                    ? 'bg-white text-indigo-950 shadow-sm'
                    : 'text-slate-600 hover:text-slate-900 hover:bg-white/50')
                }
              >
                <SchoolIcon className={"w-4 h-4 " + (activeDashboardTab === 'sessions' ? 'text-indigo-600' : 'text-slate-500')} />
                <span>교내 교직원 연수등록부</span>
                <span className={"px-2 py-0.5 rounded-full text-[10px] font-black " + (activeDashboardTab === 'sessions' ? 'bg-indigo-50 text-indigo-700' : 'bg-slate-200 text-slate-700')}>
                  {trainings.length}
                </span>
              </button>

              <button
                type="button"
                onClick={() => setActiveDashboardTab('statutory')}
                className={
                  "flex items-center gap-2 px-4 py-2 rounded-xl text-xs sm:text-sm font-extrabold transition-all cursor-pointer " +
                  (activeDashboardTab === 'statutory'
                    ? 'bg-emerald-600 text-white shadow-sm'
                    : 'text-slate-600 hover:text-slate-900 hover:bg-white/50')
                }

                <GraduationCapIcon className={"w-4 h-4 " + (activeDashboardTab === 'statutory' ? 'text-white' : 'text-emerald-600')} />

                <span className={"px-2 py-0.5 rounded-full text-[10px] font-black " + (activeDashboardTab === 'statutory' ? 'bg-emerald-700 text-emerald-100' : 'bg-emerald-100 text-emerald-800')}>

            </div>

              onAddRecord={onAddStatutoryRecord}
              onUpdateRecord={onUpdateStatutoryRecord}
              onDeleteRecord={onDeleteStatutoryRecord}

                  <span>계촌중학교 교직원 연수 통합 포털</span>

                <h1 className="text-xl sm:text-2xl md:text-3xl font-black tracking-tight leading-tight">

                <p className="text-xs sm:text-sm text-indigo-200 max-w-xl leading-relaxed">
                  학년도별로 연수 관리대장을 한눈에 구분하여 조회하고, 고유 QR코드 모바일 서명 및 종이등록부 스캔본을 안전하게 영구 보관합니다.
                </p>
              </div>

              <div className="flex flex-wrap md:flex-nowrap items-center gap-4 sm:gap-5 self-start md:self-auto">
                <div className="flex flex-col sm:flex-row md:flex-col gap-2.5">
                  <button
                    onClick={() => exportAllTrainingsListToExcel(filteredTrainings)}
                    className="flex items-center justify-center gap-2 px-4 py-2.5 rounded-2xl bg-white/10 hover:bg-white/20 text-white font-bold text-xs sm:text-sm border border-white/20 shadow-sm active:scale-95 transition-all"
                    title="현재 학년도 연수 관리대장 및 서명 통계를 Excel(.xlsx)로 다운로드"
                  >
                    <FileSpreadsheetIcon className="w-4 h-4 text-emerald-400" />
                    <span>연수 대장 Excel 다운로드</span>
                  </button>

                      setNewAcademicYear(getCurrentAcademicYear());
                      setNewDate(getKoreanTodayDateString());
                      setIsModalOpen(true);

                    className="flex items-center justify-center gap-2 px-5 py-2.5 rounded-2xl bg-indigo-500 hover:bg-indigo-400 text-white font-bold text-xs sm:text-sm shadow-lg hover:shadow-indigo-500/25 active:scale-95 transition-all"
                  >
                    <PlusIcon className="w-4 h-4" />

                  </button>

                {/* School Emblem on Right side of Blue Banner (Hover shows 마크 변경, Click opens modal) */}

                  className="group relative flex items-center justify-center p-2 rounded-2xl bg-white/10 backdrop-blur-md border border-white/20 shadow-lg hover:bg-white/20 hover:scale-105 active:scale-95 transition-all cursor-pointer ring-2 ring-transparent hover:ring-amber-300/50 shrink-0"
                  title="계촌중학교 교표(원형 마크) 설정 및 고화질 이미지 등록 (클릭하여 변경)"

    function QrShareModal({ isOpen, onClose, training, onNavigateToSign }) {

      const handleCopyUrl = async () => {
        try {
          await navigator.clipboard.writeText(targetUrl);
          setCopied(true);
          setTimeout(() => setCopied(false), 2000);
        } catch (e) {
          window.prompt('서명 접속 URL (복사하여 사용하세요):', targetUrl);

    // Main App Component with State Management
    // ==========================================
    function App() {
      const initialUrlInfo = parseTrainingFromUrl();

      const [trainings, setTrainings] = useState(() => {
        let list = INITIAL_TRAININGS;
        try {
          const saved = localStorage.getItem(STORAGE_KEY);
          if (saved) {
            const parsed = JSON.parse(saved);
            if (Array.isArray(parsed) && parsed.length > 0) {
              list = parsed.map(t => ({
                ...t,
                staffList: (t.staffList || []).map(s =>
                  s.id === 10 && s.name === '김기민' ? { ...s, name: '박기민' } : s
                )
              }));
            }
          }
        } catch (e) {
          console.warn('LocalStorage error', e);
        }

        if (initialUrlInfo.trainingId) {
          const existing = list.find(t => t.id === initialUrlInfo.trainingId);
          if (!existing && initialUrlInfo.metadata) {
            const created = createSessionFromMetadata(initialUrlInfo.metadata);
            list = [created, ...list];
          }
        }
        return sortTrainingsByDateAscending(list);
      });

      const [statutoryTrainings, setStatutoryTrainings] = useState(() => {
        try {
          const saved = localStorage.getItem(STORAGE_KEY_STATUTORY);
          if (saved !== null) {
            const parsed = JSON.parse(saved);
            if (Array.isArray(parsed)) return parsed;
          }
        } catch (e) {
          console.warn('LocalStorage error', e);
        }
        return INITIAL_STATUTORY_TRAININGS;
      });

      const [currentView, setCurrentView] = useState(() => initialUrlInfo.targetView);
      const [activeTrainingId, setActiveTrainingId] = useState(() => {
        if (initialUrlInfo.trainingId) return initialUrlInfo.trainingId;
        return trainings[0]?.id || INITIAL_TRAININGS[0].id;
      });
      const [qrModalTrainingId, setQrModalTrainingId] = useState(null);
      const [editingTraining, setEditingTraining] = useState(null);
      const [isLogoModalOpen, setIsLogoModalOpen] = useState(false);
      const [isBackupModalOpen, setIsBackupModalOpen] = useState(false);
      const [isCloudConnected, setIsCloudConnected] = useState(false);

      useEffect(() => {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(trainings));
        } catch (e) {
          console.warn('LocalStorage save error', e);
        }
      }, [trainings]);

      useEffect(() => {
        try {
          localStorage.setItem(STORAGE_KEY_STATUTORY, JSON.stringify(statutoryTrainings));
        } catch (e) {
          console.warn('LocalStorage save error', e);
        }
      }, [statutoryTrainings]);

      // Daily Automatic Backup Scheduler to Firebase
      useEffect(() => {
        const checkAndRunBackup = async () => {
          if (!window.__FIREBASE_DB__ || !window.__FIREBASE_OPS__) return;
          try {
            const now = new Date();
            const currentHour = now.getHours();
            const currentMinute = now.getMinutes();
            const todayStr = getTodayDateString(now);
            const meta = getStoredBackupMeta();

            let designatedHour = 0;
            let designatedMinute = 0;
            if (meta && meta.designatedTime) {
              const parts = meta.designatedTime.split(':').map(Number);
              if (parts.length >= 2 && !isNaN(parts[0]) && !isNaN(parts[1])) {
                designatedHour = parts[0];
                designatedMinute = parts[1];
              }
            }

            const alreadyBackedUpToday = meta.lastBackupDate === todayStr && meta.status === 'success';
            const timeReached = currentHour > designatedHour || (currentHour === designatedHour && currentMinute >= designatedMinute);

            if (!alreadyBackedUpToday && timeReached) {
              console.log('[BackupScheduler] Scheduled daily backup executing...');
              await forceBackupToFirebase('automatic');
            }
          } catch (e) {
            console.warn('[BackupScheduler] Check error', e);
          }
        };

        checkAndRunBackup();
        const intervalId = window.setInterval(checkAndRunBackup, 60000);
        const handleVis = () => {
          if (document.visibilityState === 'visible') checkAndRunBackup();
        };
        document.addEventListener('visibilitychange', handleVis);
        return () => {
          window.clearInterval(intervalId);
          document.removeEventListener('visibilitychange', handleVis);
        };
      }, []);

      // Firebase Firestore Real-Time Cross-Device Synchronization
      useEffect(() => {
        const startSync = () => {
          if (!window.__FIREBASE_DB__ || !window.__FIREBASE_OPS__) return;
          const { collection, doc, onSnapshot, setDoc } = window.__FIREBASE_OPS__;
          const db = window.__FIREBASE_DB__;
          let unsubTrainings = null;
          let unsubStatutory = null;

          try {
            const trainingsCol = collection(db, 'trainings');
            unsubTrainings = onSnapshot(trainingsCol, async (snapshot) => {
              setIsCloudConnected(true);
              if (snapshot.empty) {
                return;
              }

              const cloudList = [];
              snapshot.forEach((snapDoc) => {
                cloudList.push(snapDoc.data());
              });
              const sortedCloudList = sortTrainingsByDateAscending(cloudList);
              setTrainings(sortedCloudList);
            }, (err) => {
              console.warn('Firestore snapshot error', err);
              setIsCloudConnected(false);
            });
          } catch (e) {
            console.warn('Firestore setup error', e);
          }

          try {
            const statutoryCol = collection(db, 'statutoryTrainings');
            unsubStatutory = onSnapshot(statutoryCol, async (snapshot) => {
              setIsCloudConnected(true);
              if (snapshot.empty) {
                setStatutoryTrainings([]);
                return;
              }

              const cloudList = [];
              snapshot.forEach((snapDoc) => {
                cloudList.push(snapDoc.data());
              });
              cloudList.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
              setStatutoryTrainings(cloudList);
            }, (err) => {
              console.warn('Firestore statutory snapshot error', err);
            });
          } catch (e) {
            console.warn('Firestore statutory setup error', e);
          }

          return () => {
            if (unsubTrainings) unsubTrainings();
            if (unsubStatutory) unsubStatutory();
          };
        };

        if (window.__FIREBASE_DB__) {
          const unsub = startSync();
          return () => unsub && unsub();
        } else {
          let unsub = null;
          const handler = () => {
            unsub = startSync();
          };
          window.addEventListener('firebase-ready', handler, { once: true });
          return () => {
            window.removeEventListener('firebase-ready', handler);
            if (unsub) unsub();
          };
        }
      }, []);

      // URL history change listener
      useEffect(() => {
        const handleUrlChange = () => {
          const info = parseTrainingFromUrl();
          if (info.trainingId) {
            setActiveTrainingId(info.trainingId);
            if (info.metadata) {
              setTrainings(prev => {
                if (!prev.some(t => t.id === info.trainingId)) {
                  return [createSessionFromMetadata(info.metadata), ...prev];
                }
                return prev;
              });
            }
            setCurrentView(info.targetView);
          } else if (info.targetView === 'statutory') {
            setCurrentView('statutory');
          } else if (info.targetView === 'dashboard') {
            setCurrentView('dashboard');
          }
        };

        window.addEventListener('popstate', handleUrlChange);
        window.addEventListener('hashchange', handleUrlChange);
        return () => {
          window.removeEventListener('popstate', handleUrlChange);
          window.removeEventListener('hashchange', handleUrlChange);
        };
      }, []);

      const activeTraining =
        trainings.find(t => t.id === activeTrainingId) ||
        (initialUrlInfo.metadata && initialUrlInfo.metadata.id === activeTrainingId
          ? createSessionFromMetadata(initialUrlInfo.metadata)
          : trainings[0] || INITIAL_TRAININGS[0]);

      const handleSelectTraining = (id, tab) => {
        setActiveTrainingId(id);
        setCurrentView(tab);
        window.scrollTo({ top: 0, behavior: 'smooth' });

        const cleanPath = window.location.pathname.endsWith('/')
          ? window.location.pathname
          : window.location.pathname + '/';
        const newUrl = `${cleanPath}?trainingId=${encodeURIComponent(id)}&view=${tab}#${tab}`;
        window.history.pushState(null, '', newUrl);
      };

      const handleBackToDashboard = () => {
        setCurrentView('dashboard');
        const cleanPath = window.location.pathname.endsWith('/')
          ? window.location.pathname
          : window.location.pathname + '/';
        window.history.pushState(null, '', cleanPath);
      };

      const handleNavigateToStatutory = () => {
        setCurrentView('statutory');
        const cleanPath = window.location.pathname.endsWith('/')
          ? window.location.pathname
          : window.location.pathname + '/';
        window.history.pushState(null, '', cleanPath + '#statutory');
      };

      const handleCreateTraining = async (data) => {
        const newTraining = {
          id: `training-${Date.now()}`,
          title: data.title,
          date: data.date,
          time: data.time || '15:30 ~ 16:30',
          location: data.location,
          school: '계촌중학교',
          target: data.target || '전 교직원',
          instructor: data.instructor || '',
          status: 'active',
          academicYear: data.academicYear || (data.date ? getAcademicYearFromDate(data.date) : getCurrentAcademicYear()),
          scannedFiles: [],
          createdAt: Date.now(),
          staffList: BASE_STAFF_ROSTER.map(s => ({ ...s }))
        };

        setTrainings(prev => sortTrainingsByDateAscending([newTraining, ...prev.filter(t => t.id !== newTraining.id)]));
        setActiveTrainingId(newTraining.id);
        setCurrentView('dashboard');

        if (window.__FIREBASE_DB__ && window.__FIREBASE_OPS__) {
          try {
            const { doc, setDoc } = window.__FIREBASE_OPS__;
            await setDoc(doc(window.__FIREBASE_DB__, 'trainings', newTraining.id), newTraining);
          } catch (e) {
            console.warn('Firebase create error', e);
          }
        }
      };

      const handleUpdateScannedFiles = async (trainingId, files) => {
        const target = trainings.find(t => t.id === trainingId) || activeTraining;
        if (!target) return;
        const updatedSession = { ...target, scannedFiles: files };
        setTrainings(prev => prev.map(t => (t.id === trainingId ? updatedSession : t)));
        if (window.__FIREBASE_DB__ && window.__FIREBASE_OPS__) {
          try {
            const { doc, setDoc } = window.__FIREBASE_OPS__;
            await setDoc(doc(window.__FIREBASE_DB__, 'trainings', trainingId), updatedSession);
          } catch (e) {
            console.warn('Firebase scan update error', e);
          }
        }
      };

      const handleDeleteTraining = async (id) => {
        setTrainings(prev => prev.filter(t => t.id !== id));
        if (activeTrainingId === id) {
          const remaining = trainings.filter(t => t.id !== id);
          if (remaining.length > 0) setActiveTrainingId(remaining[0].id);
        }

        if (window.__FIREBASE_DB__ && window.__FIREBASE_OPS__) {
          try {
            const { doc, deleteDoc } = window.__FIREBASE_OPS__;
            await deleteDoc(doc(window.__FIREBASE_DB__, 'trainings', id));
          } catch (e) {
            console.warn('Firebase delete error', e);
          }
        }
      };

      const handleUpdateTraining = async (id, updatedData) => {
        const target = trainings.find(t => t.id === id);
        if (!target) return;
        const updatedSession = { ...target, ...updatedData };
        setTrainings(prev => sortTrainingsByDateAscending(prev.map(t => (t.id === id ? updatedSession : t))));
        if (window.__FIREBASE_DB__ && window.__FIREBASE_OPS__) {
          try {
            const { doc, setDoc } = window.__FIREBASE_OPS__;
            await setDoc(doc(window.__FIREBASE_DB__, 'trainings', id), updatedSession);
          } catch (e) {
            console.warn('Firebase update error', e);
          }
        }
      };

      const handleSaveSignature = async (trainingId, staffId, signatureDataUrl) => {
        const now = new Date();
        const formattedDate = `${now.getFullYear()}.${String(now.getMonth() + 1).padStart(2, '0')}.${String(now.getDate()).padStart(2, '0')} ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;

        const target = trainings.find(t => t.id === trainingId) || activeTraining;
        if (!target) return;

        const updatedSession = {
          ...target,
          staffList: target.staffList.map(s =>
            s.id === staffId
              ? { ...s, signature: signatureDataUrl, signedAt: formattedDate }
              : s
          )
        };

        setTrainings(prev =>
          prev.map(t => (t.id === trainingId ? updatedSession : t))
        );

        if (window.__FIREBASE_DB__ && window.__FIREBASE_OPS__) {
          try {
            const { doc, setDoc } = window.__FIREBASE_OPS__;
            await setDoc(doc(window.__FIREBASE_DB__, 'trainings', trainingId), updatedSession);
          } catch (e) {
            console.warn('Firebase sign error', e);
          }
        }
      };

      const handleAddNewStaffAndSign = async (trainingId, newStaff, signatureDataUrl) => {
        const now = new Date();
        const formattedDate = `${now.getFullYear()}.${String(now.getMonth() + 1).padStart(2, '0')}.${String(now.getDate()).padStart(2, '0')} ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;

        const target = trainings.find(t => t.id === trainingId) || activeTraining;
        if (!target) return;

        const nextId = target.staffList.length > 0 ? Math.max(...target.staffList.map(m => m.id)) + 1 : 1;
        const createdMember = {
          id: nextId,
          name: newStaff.name,
          department: newStaff.department || '교직원',
          position: newStaff.position || '교직원',
          signature: signatureDataUrl,
          signedAt: formattedDate
        };

        const updatedSession = {
          ...target,
          staffList: [...target.staffList, createdMember]
        };

        setTrainings(prev =>
          prev.map(t => (t.id === trainingId ? updatedSession : t))
        );

        if (window.__FIREBASE_DB__ && window.__FIREBASE_OPS__) {
          try {
            const { doc, setDoc } = window.__FIREBASE_OPS__;
            await setDoc(doc(window.__FIREBASE_DB__, 'trainings', trainingId), updatedSession);
          } catch (e) {
            console.warn('Firebase add staff error', e);
          }
        }
      };

      const handleResetSignatures = async (trainingId) => {
        const target = trainings.find(t => t.id === trainingId) || activeTraining;
        if (!target) return;

        const resetSession = {
          ...target,
          staffList: BASE_STAFF_ROSTER.map(s => ({ ...s }))
        };

        setTrainings(prev =>
          prev.map(t => (t.id === trainingId ? resetSession : t))
        );

        if (window.__FIREBASE_DB__ && window.__FIREBASE_OPS__) {
          try {
            const { doc, setDoc } = window.__FIREBASE_OPS__;
            await setDoc(doc(window.__FIREBASE_DB__, 'trainings', trainingId), resetSession);
          } catch (e) {
            console.warn('Firebase reset error', e);
          }
        }
      };

      const handleAddStatutoryRecord = async (record) => {
        const id = 'statutory-' + Date.now() + '-' + Math.random().toString(36).slice(2, 7);
        const newRecord = { ...record, id, createdAt: Date.now() };
        setStatutoryTrainings(prev => [newRecord, ...prev]);
        if (window.__FIREBASE_DB__ && window.__FIREBASE_OPS__) {
          try {
            const { doc, setDoc } = window.__FIREBASE_OPS__;
            await setDoc(doc(window.__FIREBASE_DB__, 'statutoryTrainings', id), newRecord);
          } catch (e) {}
        }
      };

      const handleUpdateStatutoryRecord = async (record) => {
        setStatutoryTrainings(prev => prev.map(r => r.id === record.id ? record : r));
        if (window.__FIREBASE_DB__ && window.__FIREBASE_OPS__) {
          try {
            const { doc, setDoc } = window.__FIREBASE_OPS__;
            await setDoc(doc(window.__FIREBASE_DB__, 'statutoryTrainings', record.id), record);
          } catch (e) {}
        }
      };

      const handleDeleteStatutoryRecord = async (id) => {
        setStatutoryTrainings(prev => prev.filter(r => r.id !== id));
        if (window.__FIREBASE_DB__ && window.__FIREBASE_OPS__) {
          try {
            const { doc, deleteDoc } = window.__FIREBASE_OPS__;
            await deleteDoc(doc(window.__FIREBASE_DB__, 'statutoryTrainings', id));
          } catch (e) {}
        }
      };

      const qrModalTraining = trainings.find(t => t.id === qrModalTrainingId) || null;

      return (
        <div className="min-h-screen bg-slate-100 text-slate-800 flex flex-col font-sans">
          {/* Header */}
          <header className="print:hidden sticky top-0 z-40 bg-white/95 backdrop-blur-md border-b border-slate-200 shadow-xs">
            <div className="max-w-6xl mx-auto px-4 sm:px-6 h-14 flex items-center justify-between">
              <div
                onClick={handleBackToDashboard}
                className="flex items-center gap-2.5 cursor-pointer hover:opacity-90 transition-opacity"
              >
                <GyechonSchoolLogo className="w-8 h-8 sm:w-9 sm:h-9 object-contain shrink-0 drop-shadow-xs" />
                <div>
                  <div className="text-xs font-bold text-slate-900 leading-tight flex items-center gap-1.5">
                    <span>계촌중학교 연수 등록부</span>
                    <span className="text-[10px] text-indigo-700 bg-indigo-50 border border-indigo-200 px-1.5 py-0.2 rounded font-semibold">
                      통합 포털
                    </span>
                  </div>
                  <p className="text-[10px] text-slate-400">교직원 연수 등록부 전자 관리 시스템</p>
                </div>
              </div>

              {/* View Switcher Tabs */}
              <div className="flex items-center bg-slate-100 p-1 rounded-xl border border-slate-200 gap-1 text-xs font-semibold">
                <button
                  onClick={handleBackToDashboard}
                  className={`flex items-center gap-1.5 px-3 py-1.5 rounded-lg transition-all ${
                    currentView === 'dashboard' ? 'bg-white text-indigo-700 shadow-xs font-bold' : 'text-slate-600 hover:text-slate-900'
                  }`}
                >
                  <SchoolIcon className="w-3.5 h-3.5" />
                  <span>교내 연수등록부</span>
                </button>

                <button
                  onClick={handleNavigateToStatutory}
                  className={`flex items-center gap-1.5 px-3 py-1.5 rounded-lg transition-all cursor-pointer ${
                    currentView === 'statutory' ? 'bg-emerald-600 text-white shadow-xs font-bold' : 'text-slate-600 hover:text-slate-900'
                  }`}
                >
                  <GraduationCapIcon className="w-3.5 h-3.5" />
                  <span>법정연수 대장</span>
                  <span className={`px-1.5 py-0.2 rounded-full text-[10px] font-black ${
                    currentView === 'statutory' ? 'bg-emerald-700 text-emerald-100' : 'bg-emerald-100 text-emerald-800'
                  }`}>
                    {statutoryTrainings.length}
                  </span>
                </button>

                {currentView !== 'dashboard' && currentView !== 'statutory' && (
                  <>
                    <button
                      onClick={() => setCurrentView('sign')}
                      className={`flex items-center gap-1.5 px-3 py-1.5 rounded-lg transition-all ${
                        currentView === 'sign' ? 'bg-white text-indigo-600 shadow-xs' : 'text-slate-600 hover:text-slate-900'
                      }`}
                    >
                      <PenIcon className="w-3.5 h-3.5" />
                      <span>모바일 서명</span>
                    </button>

                    <button
                      onClick={() => setCurrentView('admin')}
                      className={`flex items-center gap-1.5 px-3 py-1.5 rounded-lg transition-all ${
                        currentView === 'admin' ? 'bg-white text-indigo-600 shadow-xs' : 'text-slate-600 hover:text-slate-900'
                      }`}
                    >
                      <TableIcon className="w-3.5 h-3.5" />
                      <span>등록부 확인 & 인쇄</span>
                    </button>
                  </>
                )}
              </div>

              <div className="flex items-center gap-2">
                {/* Real-time Cloud Sync Badge in single-file HTML */}
                <div 
                  className={`hidden md:flex items-center gap-1.5 px-2.5 py-1 rounded-lg text-[11px] font-semibold border transition-all ${
                    isCloudConnected 
                      ? 'bg-emerald-50 text-emerald-700 border-emerald-200' 
                      : 'bg-slate-100 text-slate-600 border-slate-200'
                  }`}
                >
                  <span className={`w-2 h-2 rounded-full ${isCloudConnected ? 'bg-emerald-500 animate-pulse' : 'bg-slate-400'}`} />
                  <span>{isCloudConnected ? '클라우드 실시간 동기화' : '로컬 모드'}</span>
                </div>

                {/* Daily Auto-Backup & Force Backup Button */}
                <button
                  onClick={() => setIsBackupModalOpen(true)}
                  className="flex items-center gap-1.5 px-3 py-1.5 text-xs font-semibold text-sky-800 bg-sky-50 hover:bg-sky-100 rounded-xl border border-sky-200 transition-colors shadow-xs cursor-pointer"
                  title="로컬 스토리지 데이터를 Firebase 클라우드로 매일 지정된 시간에 자동 강제 백업합니다."
                >
                  <DatabaseIcon className="w-3.5 h-3.5 text-sky-600" />
                  <span className="hidden sm:inline">클라우드 백업</span>
                  <span className="sm:hidden">백업</span>
                </button>

                {/* School Emblem Customization Button */}
                <button
                  onClick={() => setIsLogoModalOpen(true)}
                  className="flex items-center gap-1.5 px-3 py-1.5 text-xs font-semibold text-emerald-800 bg-emerald-50 hover:bg-emerald-100 rounded-xl border border-emerald-200 transition-colors shadow-xs"
                  title="계촌중학교 교표(원형 마크) 설정 및 고화질 PNG 등록"
                >
                  <ImageIcon className="w-3.5 h-3.5 text-emerald-600" />
                  <span className="hidden sm:inline">교표(마크) 설정</span>
                  <span className="sm:hidden">교표</span>
                </button>

                {currentView !== 'dashboard' && activeTraining ? (
                  <button
                    onClick={() => setQrModalTrainingId(activeTraining.id)}
                    className="flex items-center gap-1.5 px-3 py-1.5 text-xs font-semibold text-slate-700 bg-slate-100 hover:bg-slate-200 rounded-xl border border-slate-200 transition-colors"
                  >
                    <QrCodeIcon className="w-4 h-4 text-indigo-600" />
                    <span className="hidden sm:inline">서명 QR</span>
                  </button>
                ) : (
                  <span className="text-xs text-slate-400 hidden sm:inline">
                    총 {trainings.length}개 연수 대장
                  </span>
                )}
              </div>
            </div>
          </header>

          {/* Main Content */}
          <main className="flex-1 w-full">
            {(currentView === 'dashboard' || currentView === 'statutory') && (
              <TrainingDashboard
                trainings={trainings}
                onSelectTraining={handleSelectTraining}
                onCreateTraining={handleCreateTraining}
                onEditTraining={t => setEditingTraining(t)}
                onDeleteTraining={handleDeleteTraining}
                onOpenQrModal={(id) => setQrModalTrainingId(id)}
                onOpenLogoModal={() => setIsLogoModalOpen(true)}
                statutoryTrainings={statutoryTrainings}
                onAddStatutoryRecord={handleAddStatutoryRecord}
                onUpdateStatutoryRecord={handleUpdateStatutoryRecord}
                onDeleteStatutoryRecord={handleDeleteStatutoryRecord}
                activeTab={currentView === 'statutory' ? 'statutory' : 'sessions'}
                onTabChange={(tab) => {
                  if (tab === 'statutory') {
                    handleNavigateToStatutory();
                  } else {
                    handleBackToDashboard();
                  }
                }}
              />
            )}

            {currentView === 'sign' && activeTraining && (
              <MobileSignView
                training={activeTraining}
                onBackToDashboard={handleBackToDashboard}
                onNavigateToStatutory={handleNavigateToStatutory}
                onSaveSignature={handleSaveSignature}
                onAddNewStaffAndSign={handleAddNewStaffAndSign}
              />
            )}

            {currentView === 'admin' && activeTraining && (
              <AdminTableView
                training={activeTraining}
                allTrainings={trainings}
                onBackToDashboard={handleBackToDashboard}
                onResetSignatures={handleResetSignatures}
                onEditTraining={t => setEditingTraining(t)}
                onUpdateScannedFiles={handleUpdateScannedFiles}
                onOpenLogoModal={() => setIsLogoModalOpen(true)}
              />
            )}
          </main>

          <footer className="print:hidden py-5 border-t border-slate-200 text-center text-xs text-slate-400 bg-white">
            계촌중학교 · 교직원 연수등록부 통합 전자 관리 포털 시스템
          </footer>

          <EditTrainingModal
            isOpen={!!editingTraining}
            training={editingTraining}
            onClose={() => setEditingTraining(null)}
            onSave={handleUpdateTraining}
          />

          <QrShareModal
            isOpen={!!qrModalTrainingId}
            onClose={() => setQrModalTrainingId(null)}
            training={qrModalTraining}
            onNavigateToSign={(trainingId) => {
              setActiveTrainingId(trainingId);
              setCurrentView('sign');
            }}
          />

          <SchoolLogoModal
            isOpen={isLogoModalOpen}
            onClose={() => setIsLogoModalOpen(false)}
          />

          <BackupSchedulerModal
            isOpen={isBackupModalOpen}
            onClose={() => setIsBackupModalOpen(false)}
            isCloudConnected={isCloudConnected}
          />
        </div>
      );
    }

    // Mount to DOM safely
    try {
      const rootEl = document.getElementById('root');
      if (rootEl) {
        const root = ReactDOM.createRoot(rootEl);
        root.render(
          <ErrorBoundary>
            <App />
          </ErrorBoundary>
        );
      }
    } catch (e) {
      console.error('Mount error:', e);
      var target = document.getElementById('root') || document.body;
      if (target) {
        target.innerHTML = '<div style="padding: 24px; text-align: center; color: #dc2626;">마운트 오류가 발생했습니다: ' + (e.message || e) + '</div>';
      }
    }
  </script>
</body>
</html>
